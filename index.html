/* なまえを かえる／けす */
let nmEdit = false, delArm = false;
function nmMsg(t){
  const m = document.getElementById('nameMsg');
  if(m) m.textContent = t || '';
}
function disarm(){
  const d = document.getElementById('nameDel');
  if(d){ d.classList.remove('arm'); d.textContent = 'けす'; }
  delArm = false;
}
function setEdit(on){
  nmEdit = !!on;
  const e = document.getElementById('nameEdit');
  const inp = document.getElementById('nameIn');
  const ok = document.getElementById('nameOk');
  if(!e || !inp || !ok) return;
  e.classList.toggle('on', nmEdit);
  e.textContent = nmEdit ? 'やめる' : 'なまえを かえる';
  ok.textContent = nmEdit ? 'かえる' : 'ふやす';
  inp.value = nmEdit ? who : '';
  nmMsg('');
  if(nmEdit) setTimeout(function(){ inp.focus(); inp.select(); }, 40);
}
function renameWho(v){
  v = String(v || '').trim().slice(0, 8);
  if(!v){ nmMsg('なまえを いれてね'); return; }
  if(v === who){ setEdit(false); return; }
  if(recs[v]){ nmMsg('その なまえは もう あります'); return; }
  const old = who;
  recs[v] = recs[old] || [0, 0, 0];
  delete recs[old];
  cols[v] = colOf(old);
  delete cols[old];
  who = v;
  try{ localStorage.setItem(WKEY, who);
       localStorage.setItem(CKEY, JSON.stringify(cols)); }catch(e){}
  saveRecs();
  best = bestOf(who); paintHud(); paintRank();
  openName(false);
  nmMsg(old + ' → ' + who);
}
function delWho(){
  const gone = who;
  delete recs[gone];
  delete cols[gone];
  try{ localStorage.setItem(CKEY, JSON.stringify(cols)); }catch(e){}
  saveRecs();
  const left = Object.keys(recs);
  who = '';
  setWho(left.length ? left[0] : DEF1);
  openName(false);
  nmMsg(gone + ' を けしました');
}
function openName(add){
  const box = document.getElementById('nameBox');
  const inp = document.getElementById('nameIn');
  const list = document.getElementById('whoList');
  inp.value = '';
  document.getElementById('nameTitle').textContent = add ? 'プレイヤーを ふやす' : 'プレイヤー';
  const names = Object.keys(recs);
  if(names.indexOf(who) < 0) names.unshift(who);
  list.innerHTML = names.map(n =>
    '<button type="button" class="' + (n === who ? 'on' : '') + '" data-n="' + esc(n) + '">'
    + esc(n) + '</button>').join('');
  [].forEach.call(list.children, b =>
    b.addEventListener('click', () => {
      setWho(b.getAttribute('data-n'));
      [].forEach.call(list.children, x => x.classList.toggle('on', x === b));
      paintCols(); disarm(); setEdit(false);
    }));
  paintCols();
  disarm(); setEdit(false);
  paused = true;
  box.classList.add('on');
  if(add) setTimeout(() => inp.focus(), 40);
}
function closeName(){
  document.getElementById('nameBox').classList.remove('on');
  if(!over && !document.getElementById('over').classList.contains('on')) paused = false;
  dropAt = performance.now();
}

/* ---- むずかしさ ---- */
function paintLv(){
  const row = document.getElementById('lv');
  if(row) [].forEach.call(row.children, (b, i) => b.classList.toggle('on', i === lv));
  const trow = document.getElementById('tm');
  if(trow) [].forEach.call(trow.children, (b, i) => b.classList.toggle('on', i === tm));
  const row2 = document.getElementById('lv');
  if(row2) row2.classList.toggle('hide', !!TIMES[tm]);   /* むずかしさは ∞ のときだけ */
  const h = document.getElementById('hint');
  if(h) h.innerHTML = TIMES[tm]
    ? '3分間の点数を競おう！<br>赤い線を越えたらゲームオーバだよ。'
    : 'クリアを目指そう！<br>赤い線を越えたらゲームオーバだよ。';
}
function setLv(n){
  if(n === lv) return;
  lv = n;
  try{ localStorage.setItem(LKEY, String(lv)); }catch(e){}
  paintLv();
  if(idle) toIdle(); else reset();
}
function setTime(n){
  if(n === tm) return;
  tm = n;
  LIMIT = TIMES[tm] || Infinity;
  try{ localStorage.setItem(TKEY, String(tm)); }catch(e){}
  paintLv();
  if(idle) toIdle(); else reset();
}

function fit(){
  W = 330; H = 465;
  /* 画面の高さに おさまるように。下の一覧まで 見えるように しておく */
  const wrap = document.querySelector('.wrap');
  stage.style.maxWidth = '';
  if(wrap) wrap.style.removeProperty('--boardw');    /* はかる前に もどす */
  const top = stage.getBoundingClientRect().top + (window.scrollY || 0);
  const foot = document.querySelector('.foot');
  const chain = document.querySelector('.chain');
  /* SIZES が よこに ならんでいるときは、その高さを 引かない */
  const sr = stage.getBoundingClientRect();
  const cr = chain ? chain.getBoundingClientRect() : null;
  const side = !!(cr && cr.left >= sr.right - 2);
  const winH = window.innerHeight || 640;
  /* よこに ならんでいる ときだけ、下の ぶんを 引く。
     たての ときは 画面の はばいっぱいに 広げて、下は スクロールで */
  const below = side ? (foot ? foot.offsetHeight : 0) + 34 : 18;
  /* たてに ならぶ ときは、下の «3分バトル» の なまえが 見えるぶんを のこす */
  const avail = Math.max(240, side ? winH - top - below : winH - top - 96);
  const maxW = stage.clientWidth || 360;
  /* せまい画面でも、小さくしすぎない。足りないぶんは すこし スクロール */
  const minW = Math.min(maxW, 300);
  /* 高さに おさまる いちばん大きい 幅 */
  let wpx = Math.max(minW, Math.min(maxW, Math.floor(avail * W / H)));
  stage.style.maxWidth = wpx + 'px';
  if(wrap && side) wrap.style.setProperty('--boardw', wpx + 'px');
  wpx = stage.clientWidth || wpx;
  const cong = document.getElementById('cong');
  if(cong) cong.firstElementChild.style.fontSize = (wpx * 0.083).toFixed(1) + 'px';
  const sb = document.getElementById('startBtn');
  if(sb){
    const d = Math.max(118, Math.min(186, wpx * 0.46));
    sb.style.width = sb.style.height = d.toFixed(0) + 'px';
    sb.querySelector('b').style.fontSize = (d * 0.168).toFixed(1) + 'px';
    const ic = sb.querySelector('.ico');      /* 犬ボールは いつも 小さく */
    if(ic){
      const xm = ic.classList.contains('xm');
      ic.style.width = Math.round(xm ? Math.min(40, d * 0.25)
                                     : Math.min(32, d * 0.20)) + 'px';
    }
  }
  const cn = document.getElementById('count');
  if(cn){
    cn.querySelector('span').style.fontSize = (wpx * 0.26).toFixed(1) + 'px';
    const rg = cn.querySelector('.ring');
    rg.style.width = rg.style.height = (wpx * 0.50).toFixed(1) + 'px';
  }
  const bn = document.getElementById('bonus');
  if(bn){
    bn.querySelector('i').style.fontSize = (wpx * 0.082).toFixed(1) + 'px';
    bn.querySelector('b').style.fontSize = (wpx * 0.038).toFixed(1) + 'px';
  }
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(wpx * dpr);
  cv.height = Math.round(wpx * dpr * (H / W));
  cv.style.height = Math.round(wpx * (H / W)) + 'px';
}

function toStageX(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}

let pointing = false;
stage.addEventListener('pointerdown', e => {
  /* «つづける»／«もういちど» の ボタンの ときは 板を さわらない。
     さわると ポインタを 板が つかんでしまい、ボタンが 押せなくなる */
  if(over || paused || flying) return;
  if(e.target && e.target.closest && e.target.closest('.over')) return;
  pointing = true;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  aimX = toStageX(e.clientX);
  e.preventDefault();
});
/* カーソルを のせて 動かすだけで、待っている子も ついてくる */
stage.addEventListener('pointermove', e => {
  if(over || paused || flying) return;
  aimX = toStageX(e.clientX);
});
stage.addEventListener('pointerup', e => {
  if(!pointing) return;
  pointing = false;
  aimX = toStageX(e.clientX);
  drop();
});
stage.addEventListener('pointercancel', () => { pointing = false; });

/* 矢印は «押しているあいだ» すーっと 動く。
   押しはじめは ゆっくり、そのまま 押していると 少し はやく */
const KEYD = { left: false, right: false };
let keySpd = 0;
const KEY_SLOW = 0.10, KEY_FAST = 0.44, KEY_ACC = 0.0016;   /* px / ms */
function keyAim(dt){
  const dir = (KEYD.right ? 1 : 0) - (KEYD.left ? 1 : 0);
  if(!dir){ keySpd = 0; return; }
  if(!keySpd) keySpd = KEY_SLOW;
  keySpd = Math.min(KEY_FAST, keySpd + KEY_ACC * dt);
  aimX = Math.max(0, Math.min(W, aimX + dir * keySpd * dt));
}

addEventListener('keydown', e => {
  if(over) return;
  if(e.key === 'ArrowLeft'){ KEYD.left = true; e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ KEYD.right = true; e.preventDefault(); }
  else if(e.key === 'ArrowDown'){ drop(); e.preventDefault(); }       /* 下で おとす */
  else if(e.key === ' ' || e.key === 'Enter'){ drop(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if(e.key === 'ArrowLeft'){ KEYD.left = false; }
  else if(e.key === 'ArrowRight'){ KEYD.right = false; }
});
addEventListener('blur', () => { KEYD.left = KEYD.right = false; keySpd = 0; });

document.getElementById('again').addEventListener('click', () => {
  if(over){ reset(); return; }
  /* クリアの つづき。板は からっぽから、時間と てんすうは そのまま */
  paused = false;
  pointing = false;
  document.getElementById('over').classList.remove('on');
  if(!cur){ cur = newDrop(); next = newDrop(); paintNext(); }
  dropAt = performance.now();
});
document.getElementById('reset').addEventListener('click', () => {
  if(idle) return;
  toIdle();                    /* START の 画面に もどる */
});
document.getElementById('quit').addEventListener('click', toIdle);
document.getElementById('startBtn').addEventListener('click', beginGame);
[].forEach.call(document.getElementById('lv').children,
  (b, i) => b.addEventListener('click', () => setLv(i)));
[].forEach.call(document.getElementById('tm').children,
  (b, i) => b.addEventListener('click', () => setTime(i)));
document.getElementById('whoBtn').addEventListener('click', () => openName(false));
document.getElementById('nameOk').addEventListener('click', () => {
  const v = document.getElementById('nameIn').value.trim();
  if(nmEdit){ renameWho(v); return; }
  if(v) setWho(v);
  closeName();
});
document.getElementById('nameEdit').addEventListener('click', () => {
  disarm(); setEdit(!nmEdit);
});
document.getElementById('nameDel').addEventListener('click', () => {
  const d = document.getElementById('nameDel');
  if(!delArm){
    delArm = true; d.classList.add('arm'); d.textContent = 'ほんとうに けす？';
    setTimeout(disarm, 4000);
    return;
  }
  delWho();
});
document.getElementById('nameClose').addEventListener('click', closeName);
document.getElementById('nameIn').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    if(nmEdit){ renameWho(e.target.value); }
    else { setWho(e.target.value || who); closeName(); }
  }
  e.stopPropagation();
});
addEventListener('resize', fit);

/* ================== まわす ================== */
let acc = 0, last = 0, lastSec = -1;
function loop(now){
  if(!last) last = now;
  let dt = now - last; last = now;
  if(dt > 100) dt = 100;
  acc += dt;
  let guard = 0;
  while(acc >= 16.6667 && guard++ < 5){
    if(!over && !paused && !flying) step();
    acc -= 16.6667;
  }
  if(flying) flyStep(dt);
  skyTick(dt, now, phaseOf(dayF()));
  runTick(dt, now);
  rollTick(dt, now);
  balTick(dt, now);
  wxTick(dt, now);
  bfTick(dt, now);
  if(!over && !paused && !flying){
    keyAim(dt);
    if(!window.__noTime) tUsed += dt;      /* 見なおし用に 時計を 止められる */
    if(LIMIT !== Infinity && tUsed >= LIMIT){ tUsed = LIMIT; timeOver(); }
    if(Math.floor(tUsed / 1000) !== lastSec){
      lastSec = Math.floor(tUsed / 1000);
      paintHud();
      if(LIMIT !== Infinity){         /* のこり10秒から、1秒ごとに ポーン */
        const left = Math.ceil((LIMIT - tUsed) / 1000);
        if(left <= 10 && left >= 1) sndTick(left);
      }
    }
    checkOver(now);
  }
  draw(now);
  requestAnimationFrame(loop);
}

/* タブや ホーム画面の アイコンは、中くらいの ベージュの 犬ボール */
(function paintIcon(){
  const img = new Image();
  img.onload = function(){
    try{
      const N = 180, c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d');
      x.fillStyle = '#FBF7F0';
      x.fillRect(0, 0, N, N);
      const sc = N * 0.86 / (SVG_R * 2);          /* 顔が ほぼ いっぱいに */
      x.drawImage(img, N / 2 - SVG_CX * sc, N / 2 - SVG_CY * sc + 3,
                  SVG_W * sc, SVG_H * sc);
      const url = c.toDataURL('image/png');
      const t = document.getElementById('favTouch');
      /* アイコンの ファイルが ないときだけ、その場で こしらえた 絵を つかう */
      if(t){
        const probe = new Image();
        probe.onerror = function(){ t.href = url; };
        probe.src = t.href;
      }
    }catch(e){}
  };
  img.src = 'data:image/svg+xml;charset=utf-8,'
    + encodeURIComponent(dogSVG(COATS[TOP_COAT], BOW[0], 0));
})();

/* よこに ずれない ように。ゆびで 広げられても、すぐ もどす */
addEventListener('scroll', function(){
  if(window.scrollX !== 0) window.scrollTo(0, window.scrollY);
}, { passive: true });
['gesturestart', 'gesturechange', 'gestureend'].forEach(function(n){
  document.addEventListener(n, function(e){ e.preventDefault(); }, { passive: false });
});

/* ウェブアプリとして 入れられるように（http/https の ときだけ） */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* START ボタンの 犬ボール */
(function(){
  const ic = document.getElementById('startIc');
  if(ic){
    if(season() === 'xmas'){
      ic.innerHTML = withHat(dogSVG(COATS[TOP_COAT], BOW[0], 0));
      ic.classList.add('xm');
    } else {
      ic.innerHTML = dogSVG(COATS[TOP_COAT], BOW[0], 0);
    }
    const sv = ic.querySelector('svg');
    if(sv){ sv.removeAttribute('width'); sv.removeAttribute('height'); }
  }
})();

loadBest();
paintSnd();
paintLv();
paintRank();
paintChain();                    /* 先に 下の一覧を 出してから 高さを合わせる */
fit(); fit();
toIdle();
requestAnimationFrame(loop);

/* デモ・見なおし用の のぞき窓 */
window.__GAME = {
  state: () => ({ n: balls.length, score: score, best: best, over: over,
                  tiers: balls.map(b => b.t), kinds: balls.map(b => b.kind),
                  cis: balls.map(b => b.ci), aim: +aimX.toFixed(2),
                  topY: balls.length ? Math.min.apply(null, balls.map(b => b.y - b.r)) : null,
                  line: LINE_Y, boardH: H,
                  moving: balls.filter(b =>
                    Math.abs(b.y - b.py) + Math.abs(b.x - b.px) >= 1.2).length,
                  balls: balls.map(b => ({ t: b.t, x: +b.x.toFixed(1),
                                           y: +b.y.toFixed(1), r: b.r })) }),
  cur: () => cur && { t: cur.t, r: cur.r, ci: cur.ci },
  clears: () => clears,
  left: () => LIMIT - tUsed,
  lv: () => lv,
  elv: () => curLv(),
  setLv: n => setLv(n),
  noTime: on => { window.__noTime = !!on; },
  aim: x => { aimX = x; },
  aimNow: () => +aimX.toFixed(2),
  drop: () => { dropAt = 0; drop(); },
  put: (t, x, kind) => { const b = makeBall(t, x, LINE_Y + 10, kind); balls.push(b); return b.id; },
  sky: () => ({ fill: fillT, rain: rain, flying: !!flying }),
  setT: ms => { tUsed = Math.max(0, Math.min(LIMIT, ms)); paintHud(); },
  atF: f => { tUsed = Math.max(0, Math.min(1, f)) * LIMIT; paintHud(); },
  hour: h => { window.__hour = h; },
  dayF: () => +dayF().toFixed(3),
  skyList: () => SKYL.map(o => ({ k: o.kind, st: o.st, x: +o.x.toFixed(1),
                                  y: +o.y.toFixed(1), job: o.job || '' })),
  lifts: () => LIFTS.length,
  pestIn: () => Math.round((pestNext - performance.now()) / 1000),
  rbs: () => balls.filter(b => b.rb).length,
  rbNow: () => { rbNext = -1; },
  mark: id => { const b = balls.filter(q => q.id === id)[0]; if(b) b.rb = true; },
  spawn: k => { const now = performance.now();
    if(k === 'ufo'){ spawnUfo(now); return; }
    spawnSky(now, k === 'bird' ? 0 : k === 'crow' ? 1 : 2);
    const o = SKYL[SKYL.length - 1]; o.kind = k;
    if(k === 'hero'){ o.st = 'pass'; o.v = o.face * 0.92; } },
  ufoJob: j => { const now = performance.now(); spawnUfo(now);
    const o = SKYL[SKYL.length - 1]; o.job = j; o.v = o.v * 3; return o.tx; },
  rush: ms => { tUsed = Math.min(LIMIT, tUsed + ms); paintHud(); },
  glowAll: () => { const t = performance.now();
    balls.forEach(b => { b.glow = t; b.glowC = 'plain'; }); },
  reset: reset,
  idle: () => idle,
  runner: () => runner && { x: +runner.x.toFixed(1), dir: runner.dir, g: runner.gait },
  rolls: () => rolls.map(o => ({ x: +o.x.toFixed(1), r: +o.r.toFixed(1), k: !!o.crown,
                                 rot: +(((o.rot % 6.2832) + 6.2832) % 6.2832).toFixed(2) })),
  season: () => ({ s: season(), h: harvestMD(new Date().getFullYear()),
                   wx: wxKind(), n: wx.length + fw.length,
                   now: new Date().toString() }),
  wxNow: () => { wxEnd = performance.now() + 30000; wxNext = wxEnd + 50000; return 1; },
  star: () => { starAdd(); return 1; },
  bfly: () => { bfNext = 0; return 1; },
  setRunner: (pose, pups) => {
    runner = { x: W * 0.45, dir: 1, gait: 0, v0: 0.55, v: pose ? 0 : 0.55,
               fp: 0.155, ph: 0, say: '', pose: pose || '',
               st: pose ? 'rest' : 'walk', stopX: W * 0.45,
               rest: performance.now() + 600000, pups: pups == null ? 2 : pups,
               coat: ['', ''] };
    return 1;
  },
  rollStop: () => { rolls.forEach(o => { o.v = 0; o.rot = 0; o.x = W * 0.5; }); return rolls.length; },
  bals: () => bals.map(o => ({ x: +o.x.toFixed(1), y: +o.y.toFixed(1), r: +o.r.toFixed(1) })),
  bal: () => { bals.length = 0; balNext = 1; balTick(16, 1e9); return bals.length; },
  roll: (n) => { rolls.length = 0; rollNext = 1; rollTick(16, 1e9); return rolls.length; },
  pest: () => dropPest(performance.now()),
  iconSvg: () => dogSVG(COATS[TOP_COAT], BOW[0], 0),
  mochiSvg: () => dogSVG(COATS[7], BOW[0], 0),
  rabSvg: () => rabBackSvg(),
  start: () => beginGame(),
  quit: () => toIdle()
};
})();
