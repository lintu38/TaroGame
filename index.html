<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF7F0">
<title>TARO GAME</title>
<link rel="icon" id="favIcon" href="data:,">
<link rel="apple-touch-icon" id="favTouch" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TARO GAME">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --bg-soft:#F6EFE4; --bg-card:#FFFDF8;
    --line:#EFE6D6; --beige:#C9A87C; --beige-deep:#A88A63;
    --text:#4B4038; --text-muted:#8B7C6B; --text-faint:#B8AC9A;
    --sky-a:#EAF1F3; --sky-b:#F7F1E6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
    overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; align-items:center;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom)); min-height:100dvh; }

  .head{ text-align:center; margin:2px 0 10px; }
  .head h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.06em; }
  .head h1 .t-paw{ display:inline-block; line-height:0; margin:0 7px; vertical-align:-3px; }
  .head h1 .t-paw svg{ width:23px; height:20px; display:block; fill:#C7AC87; opacity:.9; }
  .head p{ margin:3px 0 0; font-size:11.5px; color:var(--text-muted); }

  .wrap{ width:100%; max-width:min(520px, 100%); }

  /* 画面の広い パソコンでは、SIZES を よこに置いて
     そのぶん 遊ぶ板を 大きく する */
  @media (min-width:880px) and (min-height:620px){
    .wrap{ max-width:none; width:auto; display:grid; align-items:start;
      gap:0 22px;
      grid-template-columns:var(--boardw, minmax(300px,560px)) 300px;
      grid-template-areas:"bar ." "stage side" "foot side"; }
    .bar{ grid-area:bar; }
    .stage{ grid-area:stage; }
    .foot{ grid-area:foot; }
    .side{ grid-area:side; }
    .side .chain:first-child{ margin-top:0; }
    .head h1{ font-size:22px; }
    .foot .hint{ font-size:14.5px; }
  }

  .bar{ display:flex; align-items:stretch; gap:8px; margin-bottom:8px; }
  .pill{ flex:1; background:var(--bg-card); border:1px solid var(--line);
    border-radius:13px; padding:7px 11px; display:flex; align-items:baseline; gap:7px; }
  .pill .lab{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em;
    color:var(--beige-deep); }
  .pill .val{ font-family:'Space Mono',monospace; font-size:17px; font-weight:700;
    margin-left:auto; }
  .pill.best .val{ color:var(--text-muted); font-size:15px; }
  .pill.time{ flex:0 0 auto; }
  .pill.time .val{ font-size:15px; margin-left:4px; }
  .pill.time.low .val{ color:#A02C3C; }
  .pill.clr{ flex:0 0 auto; }
  .pill.clr .val{ color:#A02C3C; font-size:15px; margin-left:4px; }
  .snd{ flex:0 0 auto; width:40px; border:1px solid var(--line); border-radius:13px;
    background:var(--bg-card); color:var(--beige-deep); cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .snd svg{ width:19px; height:19px; display:block; fill:currentColor; }
  .snd svg .wav, .snd svg .cut{ fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linecap:round; }
  .snd svg .cut{ display:none; }
  .snd.off{ color:var(--text-faint); }
  .snd.off svg .wav{ display:none; }
  .snd.off svg .cut{ display:block; }
  .snd:active{ transform:scale(.95); }

  .stage{ position:relative; width:100%; margin:0 auto; background:var(--bg-card);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 12px 30px -24px var(--beige-deep); touch-action:none; }
  canvas{ display:block; width:100%; height:auto; }

  /* つぎの子 */
  .stage.idle .next{ display:none; }
  .next{ position:absolute; left:10px; top:9px; display:flex; align-items:center; gap:7px;
    background:rgba(255,253,248,.82); border:1px solid var(--line); border-radius:99px;
    padding:4px 11px 4px 5px; pointer-events:none; }
  .next i{ width:26px; height:26px; display:block; }
  .next i svg{ width:100%; height:100%; display:block; }
  .next b{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em;
    color:var(--beige-deep); font-weight:400; }

  /* クリアした しゅんかんの 大きな文字 */
  .cong{ position:absolute; left:0; right:0; top:26%; display:none;
    justify-content:center; pointer-events:none; }
  .cong.on{ display:flex; }
  .cong span{ font-family:'Space Mono',monospace; font-weight:700;
    font-size:26px; letter-spacing:.02em; white-space:nowrap;
    color:#8A6A46;
    text-shadow:0 4px 12px rgba(120,100,80,.20);
    animation:congIn .62s cubic-bezier(.2,1.5,.5,1) both, congFloat 2.1s .62s ease-in-out infinite; }
  @keyframes congIn{
    0%{ transform:scale(.4) rotate(-7deg); opacity:0; }
    70%{ transform:scale(1.12) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes congFloat{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-5px) scale(1.035); } }

  /* 風船が 空へ帰るときの ボーナス */
  .bonus{ position:absolute; left:0; right:0; top:41%; display:none;
    justify-content:center; align-items:baseline; gap:9px; pointer-events:none; }
  .bonus.on{ display:flex; }
  .bonus b{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.16em;
    color:#8A6A46; }
  .bonus i{ font-family:'Space Mono',monospace; font-weight:700; font-style:normal;
    font-size:26px; color:#A02C3C; transform-origin:50% 60%;
    text-shadow:0 4px 10px rgba(120,100,80,.20); }
  .bonus.pop i{ animation:bnPop .24s cubic-bezier(.2,1.6,.5,1); }
  @keyframes bnPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.28); }
    100%{ transform:scale(1); } }

  /* 3・2・1 の かぞえ */
  .count{ position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    color:#A02C3C; }
  .count.on{ display:grid; }
  .count > *{ grid-area:1 / 1; }
  .count span{ font-family:'Space Mono',monospace; font-weight:700; font-size:84px;
    color:inherit; line-height:1; animation:cnPop .62s ease-out both; }
  /* まわる タイムバー */
  .count .ring{ width:168px; height:168px; transform:rotate(-90deg); overflow:visible; }
  .count .ring circle{ fill:none; stroke-width:4.4; stroke-linecap:round; }
  .count .ring .bg{ stroke:currentColor; opacity:.16; }
  .count .ring .fg{ stroke:currentColor; stroke-dasharray:276.46;
    animation:cnRing .78s linear both; }
  @keyframes cnRing{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:276.46; } }
  @keyframes cnPop{
    0%{ transform:scale(1.8); opacity:0; }
    26%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(.92); opacity:.55; } }

  /* はじめる ボタン。ふわふわ 光る */
  .over.start{ background:rgba(251,247,240,.34); backdrop-filter:none; }
  .over.start .box{ padding:0; }
  .startBtn{ font-family:'Space Mono',monospace; font-size:21px; font-weight:700;
    letter-spacing:.2em; color:#9A7A4F; border:1px solid #EADBC2; cursor:pointer;
    padding:17px 40px 17px 46px; border-radius:99px; background:#F7EFE0;
    animation:stGlow 2.1s ease-in-out infinite; }
  .startBtn:active{ transform:scale(.97); }
  @keyframes stGlow{
    0%,100%{ box-shadow:0 8px 20px -14px var(--beige-deep), 0 0 0 0 rgba(201,168,124,.42);
      transform:scale(1); }
    50%{ box-shadow:0 12px 26px -12px var(--beige-deep), 0 0 30px 10px rgba(201,168,124,.34);
      transform:scale(1.05); } }

  .over{ position:absolute; inset:0; display:none; place-items:center;
    background:rgba(251,247,240,.86); backdrop-filter:blur(2px); }
  .over.on{ display:grid; }
  .over .box{ text-align:center; padding:20px 26px; }
  .over .box h2{ margin:0 0 4px; font-size:16px; font-weight:700; }
  .over .box .ovic{ width:62px; height:62px; margin:0 auto 6px; line-height:0; }
  .over .box .ovic svg{ width:100%; height:100%; display:block; }
  .over .box .ovic:empty{ display:none; }
  .over .box p{ margin:0 0 3px; font-size:12px; color:var(--text-muted); }
  .over .box .sc{ font-family:'Space Mono',monospace; font-size:30px; font-weight:700;
    margin:6px 0 2px; }
  .over .box .new{ font-size:11px; color:#A02C3C; margin-bottom:8px; }

  .btn{ font-family:inherit; font-size:12.5px; color:#fff; border:0; cursor:pointer;
    background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    border-radius:99px; padding:9px 22px; box-shadow:0 8px 18px -12px var(--beige-deep); }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:var(--bg-card); color:var(--text-muted);
    border:1px solid var(--line); box-shadow:none; }

  .foot{ display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .foot .hint{ flex:1 1 200px; font-size:13.5px; font-weight:500; color:var(--text-muted);
    line-height:1.7; }

  /* むずかしさ */
  .lv{ display:flex; background:var(--bg-card); border:1px solid var(--line);
    border-radius:99px; padding:2px; gap:2px; }
  .lv button{ font-family:inherit; font-size:11px; color:var(--text-muted);
    background:none; border:0; border-radius:99px; padding:6px 10px; cursor:pointer; }
  #tm button:last-child{ font-size:19px; line-height:1; padding:4px 16px 7px; }
  .lv button.on{ background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    color:#fff; }
  /* あそびかた（3分バトル / ∞）は 目立たせる */
  .lv.mode{ border-color:var(--beige); box-shadow:0 6px 16px -12px var(--beige-deep); }
  .lv.mode button{ font-size:13px; font-weight:700; padding:8px 16px; }
  .lv.mode button.on{ box-shadow:0 4px 10px -6px var(--beige-deep); }
  #lv.hide{ display:none; }

  /* きろく と 進化の輪 */
  .side{ display:block; }
  .chain .t .mini{ flex:0 0 auto; font-family:inherit; font-size:11.5px; cursor:pointer;
    color:#fff; border:0; border-radius:99px; padding:5px 13px;
    font-weight:700; letter-spacing:.02em;
    background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    box-shadow:0 6px 14px -9px var(--beige-deep); }
  .chain .t .mini:active{ transform:scale(.96); }
  .rank{ list-style:none; margin:2px 0 0; padding:0; }
  .rank li{ display:flex; align-items:baseline; gap:8px; font-size:12px;
    padding:4px 3px; border-bottom:1px dashed var(--line); color:var(--text-muted); }
  .rank li:last-child{ border-bottom:0; }
  .rank li b{ width:17px; height:14px; line-height:0; flex:0 0 17px; }
  .rank li b svg{ width:17px; height:14px; display:block; }
  .rank li u{ text-decoration:none; font-size:10.5px; color:var(--text-faint);
    flex:0 0 26px; font-family:'Zen Kaku Gothic New',sans-serif; }
  .rank li span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank li i{ font-style:normal; font-family:'Space Mono',monospace; font-weight:700;
    color:var(--text); }
  .rank li.me{ color:var(--text); }
  .rank li.me span{ font-weight:700; }
  .rank li.none{ color:var(--text-faint); justify-content:center; border-bottom:0; }
  #nameBox .box p{ margin-bottom:8px; }
  #nameBox input{ font-family:inherit; font-size:14px; text-align:center; color:var(--text);
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; width:180px; margin:0 0 8px; outline:none; }
  #nameBox input:focus{ border-color:var(--beige); }
  .whos{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:0 0 10px;
    max-width:230px; }
  .whos button{ font-family:inherit; font-size:12px; cursor:pointer; color:var(--text-muted);
    background:var(--bg-soft); border:1px solid var(--line); border-radius:99px;
    padding:5px 13px; }
  .whos button.on{ color:#fff; border-color:transparent;
    background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep)); }
  .nbtn{ display:flex; gap:7px; justify-content:center; }
  .nbtn .btn{ padding:8px 16px; }

  /* 大きさの一覧 */
  .chain{ margin-top:11px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:14px; padding:9px 10px; }
  .chain .t{ font-size:11px; font-weight:700; letter-spacing:.12em;
    color:var(--beige-deep); margin:0 0 6px 2px;
    display:flex; align-items:center; gap:7px; }
  .chain .t .wlab{ margin-left:auto; font-size:10.5px; font-weight:400; letter-spacing:.02em;
    color:var(--text-muted); white-space:nowrap; }
  /* 進化の輪 */
  .chain .wheel{ position:relative; width:100%; max-width:246px; margin:6px auto 2px;
    aspect-ratio:1 / 1; }
  .chain .wheel .ring{ position:absolute; inset:15%; border:1px dashed var(--line);
    border-radius:50%; }
  .chain .wheel span{ position:absolute; line-height:0; transform:translate(-50%,-50%); }
  .chain .wheel span svg{ display:block; }
  .chain .wheel em{ position:absolute; font-style:normal; color:var(--text-faint);
    font-size:11px; transform:translate(-50%,-50%); }
  .chain .wheel em.goal{ color:#A02C3C; font-size:9.5px; letter-spacing:.06em;
    font-family:'Space Mono',monospace; }
  .chain .note{ margin:4px 2px 0; font-size:11.5px; color:var(--text-muted); line-height:1.75; }
</style>
</head>
<body>

<div class="head">
  <h1>TARO<span class="t-paw"><svg viewBox="0 0 40 34" aria-hidden="true"><ellipse cx="20" cy="25" rx="8.6" ry="7"/><ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/><ellipse cx="16.5" cy="8" rx="3.7" ry="5"/><ellipse cx="24.5" cy="8" rx="3.7" ry="5"/><ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/></svg></span>GAME</h1>
</div>

<div class="wrap">
  <div class="bar">
    <div class="pill"><span class="lab">SCORE</span><span class="val" id="score">0</span></div>
    <div class="pill best"><span class="lab">BEST</span><span class="val" id="best">0</span></div>
    <div class="pill time" id="timePill"><span class="lab">TIME</span><span class="val" id="time">5:00</span></div>
    <button class="snd" id="snd" aria-label="音">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.2h3.4L12 5.2v13.6L7.4 14.8H4z"/>
        <path class="wav" d="M15.2 9.5a3.7 3.7 0 0 1 0 5"/>
        <path class="wav" d="M17.7 7.3a7 7 0 0 1 0 9.4"/>
        <path class="cut" d="M15.4 9.6 20.2 14.4M20.2 9.6 15.4 14.4"/>
      </svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="next"><i id="nextIc"></i><b>NEXT</b></div>
    <div class="cong" id="cong"><span>CONGRATULATIONS!</span></div>
    <div class="count" id="count">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bg" cx="50" cy="50" r="44"/>
        <circle class="fg" cx="50" cy="50" r="44"/>
      </svg>
      <span></span>
    </div>
    <div class="over start" id="startBox">
      <div class="box">
        <button type="button" class="startBtn" id="startBtn">START</button>
      </div>
    </div>
    <div class="bonus" id="bonus"><b>BONUS</b><i id="bonusN">+0</i></div>
    <div class="over" id="nameBox">
      <div class="box">
        <h2 id="nameTitle">プレイヤー</h2>
        <p>3分バトルの きろくは、なまえごとに のこります</p>
        <div class="whos" id="whoList"></div>
        <input id="nameIn" maxlength="8" placeholder="あたらしい なまえ" autocomplete="off">
        <div class="nbtn">
          <button class="btn" id="nameOk">ふやす</button>
          <button class="btn ghost" id="nameClose">とじる</button>
        </div>
      </div>
    </div>
    <div class="over" id="over">
      <div class="box">
        <div class="ovic" id="ovIc"></div>
        <h2 id="ovTitle">いっぱいに なりました</h2>
        <div class="sc" id="ovScore">0</div>
        <div class="new" id="ovNew" style="display:none">さいこう記録！</div>
        <div class="nbtn">
          <button class="btn" id="again">もういちど</button>
          <button class="btn ghost" id="quit">終了</button>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <p class="hint" id="hint">赤い線より うえに つみあがるか、3分で ゲームオーバー。</p>
    <div class="lv mode" id="tm">
      <button type="button" class="on">3分バトル</button>
      <button type="button" title="エンドレス" aria-label="エンドレス">∞</button>
    </div>
    <div class="lv" id="lv">
      <button type="button" class="on">やさしい</button>
      <button type="button">ふつう</button>
      <button type="button">むずかしい</button>
    </div>
    <button class="btn ghost" id="reset">やりなおす</button>
  </div>

  <div class="side">
  <div class="chain">
    <p class="t">進化の輪</p>
    <div class="wheel" id="chainRow"><div class="ring"></div></div>
    <p class="note">リボンの色がそろうと 点数2倍<br>
      虹色の子が同じ大きさの子と合体すると 点数3倍<br>
      虹色どうしなら 点数5倍<br>
      クリアすると 点数7倍</p>
  </div>
  <div class="chain rec">
    <p class="t"><span>3分バトル</span><span class="wlab">現在のプレーヤー</span><button type="button" class="mini who" id="whoBtn" title="プレイヤーを えらぶ・ふやす">なまえ</button></p>
    <ol class="rank" id="rankList"></ol>
  </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================== 絵 ================== */
/* One Step の «かご» の子と おなじ描きかた。
   ボールは 64x70 の絵で、まるい顔の中心が (32,36)、半径 28。 */
const SVG_W = 64, SVG_H = 70, SVG_CX = 32, SVG_CY = 36, SVG_R = 28;

/* 毛色は 大きさで きまる。小さい子は 濃い茶、大きくなるほど 淡く。
   あいだに グレーが ふたつ。いちばん大きい子は 中くらいの濃さの ベージュ */
const COATS = (function(){
  /* 下半分（顔と口もと）は みんな おなじ。One Step の子と おなじ色 */
  const FACE = '#EDE6D6', MUZ = '#F5F0E4';
  const TOPS = [
    ['#DCC29E', '#F0E2CC'],   /* 0 うすい ベージュ（いちばん小さい子） */
    ['#A07348', '#CBA87F'],   /* 1 茶 */
    ['#8E8B85', '#BAB7B1'],   /* 2 濃いグレー */
    ['#B8925F', '#D8BB92'],   /* 3 明るい茶 */
    ['#C9A87C', '#E4D2B4'],   /* 4 ベージュ */
    ['#C3C0BA', '#DEDCD7'],   /* 5 薄いグレー */
    ['#D3B183', '#E9D7B8'],   /* 6 こいめの ベージュ ← いちばん大きい子 */
    ['#E0CCAB', '#F0E6D4']    /* 7 淡いベージュ（クリアの ひとつ手前） */
  ];
  return TOPS.map(t => ({ coat: t[0], earIn: t[1], face: FACE, muz: MUZ }));
})();
/* 大きさ（段）ごとの 毛色 */
const TIER_COAT = [0, 1, 2, 3, 4, 5, 7, 6];
const TOP_COAT = 6;                    /* いちばん大きい子は 中くらいの濃さの ベージュ */
const BOW = ['#799837', '#875b1b', '#3e8299', '#ad465f', '#a4891e', '#36517d', '#743034'];
const BOWPOS = ['translate(13,-34.6) rotate(24 32 47.6)', 'translate(0,13.4)'];

const HEAD =
  '<defs><radialGradient id="g" cx="33%" cy="26%" r="76%">'
  + '<stop offset="0" stop-color="#fff" stop-opacity=".34"/>'
  + '<stop offset=".4" stop-color="#fff" stop-opacity=".10"/>'
  + '<stop offset=".76" stop-color="#fff" stop-opacity="0"/>'
  + '<stop offset="1" stop-color="#8C7457" stop-opacity=".2"/>'
  + '</radialGradient></defs>';

/* ================== 絵を ためておく ================== */
const sprites = {};
function spriteKey(kind, ci, bi, pi){ return kind + '|' + ci + '|' + bi + '|' + pi; }
function spriteFor(b){
  const k = spriteKey(b.kind, b.ci, b.bi, b.pi);
  let img = sprites[k];
  if(img === undefined){
    img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,'
      + encodeURIComponent(KINDS[b.kind].make(b.ci, BOW[b.bi], b.pi));
    sprites[k] = img;
  }
  return (img && img.complete && img.naturalWidth) ? img : null;
}

/* 虹の子の 絵を こしらえる。絵の かたちの ままで 色だけ 虹に */
const rbCv = document.createElement('canvas');
rbCv.width = SVG_W * 2; rbCv.height = SVG_H * 2;
const rbCx = rbCv.getContext('2d');
/* 画面に 出る 大きさに あわせて こしらえる（ぼやけない ように） */
function rbArt(img, hue, need){
  const pw = Math.max(96, Math.min(640, Math.ceil(need / 48) * 48));
  const ph = Math.round(pw * SVG_H / SVG_W);
  if(rbCv.width !== pw){ rbCv.width = pw; rbCv.height = ph; }
  rbCx.setTransform(1, 0, 0, 1, 0, 0);
  rbCx.clearRect(0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'source-over';
  rbCx.drawImage(img, 0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'color';
  rbCx.fillStyle = 'hsl(' + hue.toFixed(0) + ',95%,55%)';
  rbCx.fillRect(0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'destination-in';   /* 絵の かたちだけ のこす */
  rbCx.drawImage(img, 0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'source-over';
  return rbCv;
}

let soundOn = true, actx = null;
function audio(){
  if(!actx){
    const A = window.AudioContext || window.webkitAudioContext;
    if(!A) return null;
    actx = new A();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
/* やわらかい ひと粒。くっついた 大きさで 音が上がっていく */
function beep(freq, dur, vol, type, delay){
  if(!soundOn) return;
  const c = audio(); if(!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
function sndMerge(t, same, bowSame, chain){
  const f = SCALE[Math.min(SCALE.length - 1, t)];
  beep(f, 0.22, 0.13, 'sine');
  beep(f * 1.5, 0.16, 0.05, 'triangle', 0.03);
  if(same) beep(f * 2, 0.2, 0.05, 'sine', 0.08);   /* おなじ子どうしは ひと粒 多く */
  if(bowSame){
    /* リボンの色まで そろったら、きらきらと 三つ ならす */
    [0, 0.08, 0.16].forEach((d, i) => beep(f * (1.5 + i * 0.5), 0.3, 0.085, 'sine', 0.05 + d));
  }
  if(chain){
    /* 光っているうちに つなげたら、かけ上がる */
    [0, 0.06, 0.12, 0.18].forEach((d, i) =>
      beep(f * Math.pow(1.26, i + 1), 0.34, 0.1, 'triangle', 0.02 + d));
  }
}

/* おとす子は 下から 四つぶんの 大きさまで。
   どれが でやすいかは、むずかしさで かわる */
function newDrop(){
  const mix = LEVELS[curLv()].mix;
  let r = Math.random(), t = mix.length - 1;
  for(let i = 0; i < mix.length; i++){ if(r < mix[i]){ t = i; break; } r -= mix[i]; }
  const b = makeBall(t, aimX, LINE_Y - 34, 'dog');
  b.px = b.x; b.py = b.y;
  return b;
}

/* ---- 一歩すすめる ---- */
function step(){
  const n = balls.length;
  for(let i = 0; i < n; i++){
    const b = balls[i];
    let vx = (b.x - b.px) * DAMP;
    let vy = (b.y - b.py) * DAMP;
    if(vx > 22) vx = 22; if(vx < -22) vx = -22;
    if(vy > 26) vy = 26; if(vy < -26) vy = -26;
    b.px = b.x; b.py = b.y;
    if(b.float){                       /* UFO が そっと 降ろしている あいだ */
      if(performance.now() > b.float) b.float = 0;
      else { b.y += 1.15; b.py = b.y - 1.15; b.rot += b.spin * 0.3; continue; }
    }
    b.x += vx; b.y += vy + GRAV;
    b.rot += b.spin + vx * 0.004;
    b.spin *= 0.97;
  }

  for(let it = 0; it < ITER; it++){
    /* 子どうし */
    for(let i = 0; i < balls.length; i++){
      const a = balls[i];
      for(let j = i + 1; j < balls.length; j++){
        const b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        if(Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
        let d2 = dx * dx + dy * dy;
        if(d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2);

        /* おなじ大きさで おなじ子なら くっつく。
           いちばん大きい子どうしは、ぽんと はじけて 消える */
        if(a.t === b.t && !a.gone && !b.gone && it === 0){
          merge(a, b);
          i = -1;       /* 並びが変わるので 見なおす */
          break;
        }
        a.touch = b.touch = true;      /* だれかに あたった子 */
        a.float = b.float = 0;         /* ひかりから おりた */
        const ov = (rr - d) / d * 0.5;
        const ma = b.r * b.r, mb = a.r * a.r, tot = ma + mb;
        const sx = dx * ov, sy = dy * ov;
        a.x -= sx * (2 * ma / tot); a.y -= sy * (2 * ma / tot);
        b.x += sx * (2 * mb / tot); b.y += sy * (2 * mb / tot);
      }
      if(i === -1) break;
    }
    /* かべと ゆか */
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      if(b.x < b.r){ const v = b.px - b.x; b.x = b.r; b.px = b.x - v * WALL; }
      if(b.x > W - b.r){ const v = b.px - b.x; b.x = W - b.r; b.px = b.x - v * WALL; }
      if(b.y > H - b.r){ const v = b.py - b.y; b.y = H - b.r; b.py = b.y - v * FLOOR;
                         b.touch = true; b.float = 0; }
      /* 天井。おしくらまんじゅうで 上へ とびだしてしまわないように */
      if(b.y < b.r * 0.6){ const v = b.py - b.y; b.y = b.r * 0.6; b.py = b.y - v * 0.2; }
    }
  }
}

function merge(a, b){
  if(window.__MLOG) window.__MLOG.push([a.t, b.t, a.r, b.r]);
  a.gone = b.gone = true;
  const t = a.t + 1;
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  if(a.t >= TOP_T){
    /* いちばん大きい子が ふたり そろうと、はじけて 空へ帰る */
    const gain = PTS[TOP_T] * 4;
    score += gain;
    sndPop();
    balls = balls.filter(q => q !== a && q !== b);
    pops.push({ x: x, y: y, r: a.r * 1.3, t0: performance.now(), gain: gain, same: true });
    paintHud();
    return;
  }
  /* 特別な子は その子のまま 大きくなる。リボンの色まで そろうと なおよし */
  const bowSame = a.bi === b.bi;
  /* まだ 光っている子どうしを つなげると、れんさで もっと はずむ */
  const tn = performance.now();
  const chain = !!(a.glow && tn - a.glow < GLOW_MS) && !!(b.glow && tn - b.glow < GLOW_MS);
  const nb = makeBall(t, x, y, 'dog');
  if(bowSame) nb.bi = a.bi;              /* そろったリボンは 受けつがれる */
  if(a.rb || b.rb){ nb.rb = true; }      /* 虹の光も 受けつがれる */
  nb.px = x + (a.px - a.x + b.px - b.x) * 0.25;
  nb.py = y + (a.py - a.y + b.py - b.y) * 0.25 + 1.6;   /* ぽん、と すこし はねる */
  /* 虹の子が まざると 3ばい。虹どうしなら 5ばい */
  const rb = !!(a.rb || b.rb), rb2 = !!(a.rb && b.rb);
  const gain = PTS[t] * (bowSame ? 2 : 1) * (chain ? 3 : 1) * (rb2 ? 5 : rb ? 3 : 1)
             * (t >= TOP_T ? 7 : 1);           /* クリアの 合体は 7ばい */
  score += gain;
  /* 合体した子は 内がわから 光る */
  nb.glow = tn;
  nb.glowC = chain ? 'chain' : bowSame ? 'bow' : 'plain';
  balls = balls.filter(q => q !== a && q !== b);
  balls.push(nb);
  pops.push({ x: x, y: y, r: nb.r, t0: tn, gain: gain,
              same: bowSame, bow: bowSame, chain: chain, rb: rb });
  sndMerge(t, false, bowSame, chain);
  if(rb2){
    /* 虹どうし。ちいさな お祝い */
    [659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
      beep(f, 0.42, 0.075, 'triangle', i * 0.085));
    confetti(20);
    puff(14, Math.max(LINE_Y, y - 50), y + 50);
  } else if(rb){
    beep(1046, 0.26, 0.05, 'triangle', 0.05); beep(1318, 0.3, 0.045, 'sine', 0.14);
  }
  paintHud();
  if(t >= TOP_T) startClear(nb);     /* いちばん大きい子が できたら クリア */
}

let cheerT = 0, cheerPop = 0;
/* 紙ふぶき。上から ひらひら 落ちてくる */
const CONF_C = ['#E68A8A', '#F0B172', '#F2D98A', '#9FC98F', '#8FB4CE',
                '#9A9FD0', '#C79AC9', '#FFFDF8'];
function confetti(n){
  for(let i = 0; i < n; i++){
    confs.push({ x: Math.random() * W, y: -12 - Math.random() * H * 0.55,
                 w: 4.5 + Math.random() * 5, h: 7 + Math.random() * 7,
                 rot: Math.random() * 6.2832, spin: (Math.random() - .5) * 0.22,
                 vy: 1.0 + Math.random() * 1.7, vx: (Math.random() - .5) * 0.9,
                 ph: Math.random() * 6.2832, sw: 0.35 + Math.random() * 0.9,
                 a: 0.75 + Math.random() * 0.25,
                 c: CONF_C[Math.floor(Math.random() * CONF_C.length)] });
  }
}
function confStep(k){
  for(let i = confs.length - 1; i >= 0; i--){
    const c = confs[i];
    c.ph += 0.075 * k;
    c.y += c.vy * k;
    c.x += (c.vx + Math.sin(c.ph) * c.sw) * k;
    c.rot += c.spin * k;
    if(c.y > H + 24) confs.splice(i, 1);
  }
}
function puff(n, y0, y1){
  const t0 = performance.now();
  for(let i = 0; i < n; i++){
    sparks.push({ x: Math.random() * W, y: y0 + Math.random() * (y1 - y0),
                  vx: (Math.random() - .5) * 2.4, vy: -(0.7 + Math.random() * 2.2),
                  t0: t0, c: Math.floor(Math.random() * RB.length) });

}

function flyStep(dt){
  const k = dt / 16.6667;
  const now = performance.now();
  const rise = now >= cheerT;

  if(!rise){
    /* ---- お祝い。まだ 飛ばずに、みんなで ぴょこぴょこ ---- */
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      const q = (now - (b.cheer || now)) / 460;
      const bounce = q > 0 ? Math.abs(Math.sin(q * Math.PI)) * Math.max(0, 1 - q * 0.10) : 0;
      b.y = (b.baseY === undefined ? (b.baseY = b.y) : b.baseY) - bounce * (b.big ? 16 : 9);
      b.rot = Math.sin(q * Math.PI * 2) * (b.big ? 0.05 : 0.09);
    }
    if(now - flying > cheerPop * 420){   /* きらきらと 紙ふぶきを 何回かに わけて */
      cheerPop++;
      puff(14, LINE_Y, H);
      if(cheerPop < 5) confetti(9);
      if(cheerPop % 2 === 0) beep(880 + cheerPop * 90, 0.22, 0.05, 'triangle');
    }
  } else {
    /* ---- 風船になって 空へ。ひとりずつ、ボーナスを かぞえながら ---- */
    if(!liftSet){
      liftSet = true;
      bonusSum = 0; liftI = 0;
      const arr = balls.slice().sort((a, b2) => a.y - b2.y);   /* うえの子から */
      arr.forEach((q, i) => { q.liftAt = cheerT + i * 190; });
      lastLift = cheerT + Math.max(0, balls.length - 1) * 190;
      showBonus(0);
    }
    for(let i = balls.length - 1; i >= 0; i--){
      const b = balls[i];
      if(!b.fly){
        if(now < (b.liftAt || 0)) continue;       /* じゅんばん待ち */
        b.fly = { v: 0.9 + Math.random() * 1.1, ph: Math.random() * 6.2832,
                  sw: 5 + Math.random() * 9 };
        const add = PTS[b.t] * 2;                 /* 空へ帰る ぶんの ボーナス */
        score += add; bonusSum += add;
        paintHud(); showBonus(bonusSum);
        sndBonus(liftI++);
      }
      b.fly.ph += 0.05 * k;
      b.y -= b.fly.v * 2.1 * k;
      b.x += Math.sin(b.fly.ph) * b.fly.sw * 0.02 * k;
      b.rot = Math.sin(b.fly.ph) * 0.09;
      if(b.y < -b.r - 40) balls.splice(i, 1);
    }
  }

  for(let i = sparks.length - 1; i >= 0; i--){
    const p2 = sparks[i];
    p2.x += p2.vx * k; p2.y += p2.vy * k; p2.vy += 0.015 * k;
    if(now - p2.t0 > 2600) sparks.splice(i, 1);
  }
  confStep(k);
  if(rise && (!balls.length || now - lastLift > 4200)){
    balls = []; sparks = []; confs = []; flying = 0; cheerT = 0;
    liftSet = false;
    showCong(false);
    showBonus(0, false);
    if(LIMIT === Infinity){
      showClear(clearBall);            /* ∞ は いったん ひと休み */
    } else {
      /* 3分のときは、からっぽの 板で そのまま つづき */
      if(!cur){ cur = newDrop(); next = next || newDrop(); }
      paintNext();
      dropAt = performance.now();
      if(!over){                       /* まだ 時間が あるよ、の ひとこと */
        showCong(true, 'KEEP IT UP!');
        congT = setTimeout(() => { showCong(false); congT = 0; }, 2200);
      }
    }
  }
}

let overT = 0, overL = 0;
function checkOver(now){
  if(over) return;
  let rest = false, any = false;
  for(let i = 0; i < balls.length; i++){
    const b = balls[i];
    if(!b.touch) continue;                       /* まだ 何にも あたっていない子は 見のがす */
    if(now - b.born < 900) continue;             /* 入れたばかりの子も 見のがす */
    if(b.y - b.r >= LINE_Y) continue;            /* 線より 下にいる */
    any = true;
    const v = Math.abs(b.y - b.py) + Math.abs(b.x - b.px);
    if(v < 1.5) rest = true;                     /* 線より うえで 止まっている */
  }
  /* 線より うえで おちついたら おしまい。
     ぶつかりあって ふるえたままの ときは、しばらく ようすを見る */
  if(!rest) overT = 0; else if(!overT) overT = now;
  if(!any) overL = 0; else if(!overL) overL = now;
  if(overT && now - overT > 1500) gameOver();
  else if(overL && now - overL > 5000) gameOver();
}

function hx(c){ return [parseInt(c.substr(1,2),16), parseInt(c.substr(3,2),16), parseInt(c.substr(5,2),16)]; }
function mix(a, b, k){
  const x = hx(a), y = hx(b);
  return 'rgb(' + Math.round(x[0]+(y[0]-x[0])*k) + ',' + Math.round(x[1]+(y[1]-x[1])*k)
       + ',' + Math.round(x[2]+(y[2]-x[2])*k) + ')';
}
function skyAt(f){
  for(let i = 0; i < SKY.length - 1; i++){
    const a = SKY[i], b = SKY[i + 1];
    if(f <= b.at || i === SKY.length - 2){
      const k = Math.max(0, Math.min(1, (f - a.at) / (b.at - a.at)));
      return { top: mix(a.top, b.top, k), bot: mix(a.bot, b.bot, k),
               night: a.night + (b.night - a.night) * k };
    }
  }
  return { top: SKY[0].top, bot: SKY[0].bot, night: 0 };
}

const skyImg = {};
function skyArt(name, svg){

    img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    skyImg[name] = img;
  }
  return (img && img.complete && img.naturalWidth) ? img : null;
}

/* ================== 空の ようす ================== */
/* 昼は お日さまと 小鳥、夕方は 夕日と カラス、夜は お月さまと 星と フクロウ。
   ときどき UFO や 空をとぶ人。赤い線に とまったり、飛んでいったり する */
const SKYL = [];
const LIFTS = [];                      /* UFO に さらわれて のぼる子 */
let skyNext = 0, skyPh = 0, ufoNext = 0, rbNext = 0, heroNext = 0;
function phaseOf(f){ return f < 0.30 ? 0 : f < 0.84 ? 1 : 2; }
/* いまの 時刻を、空の すすみぐあいに うつす（∞ のとき）
   0 ＝ 昼の あおぞら、1 ＝ まよなか */
const CLOCK = [[0, 1], [4.5, 1], [6, 0.62], [7.5, 0.05], [15, 0.18],
               [16.5, 0.42], [18, 0.68], [19, 0.88], [20.5, 1], [24, 1]];
function clockF(){
  let h;
  if(typeof window.__hour === 'number') h = window.__hour;
  else { const d = new Date(); h = d.getHours() + d.getMinutes() / 60; }
  h = Math.max(0, Math.min(24, h));
  for(let i = 0; i < CLOCK.length - 1; i++){
    if(h <= CLOCK[i + 1][0]){
      const a = CLOCK[i], b = CLOCK[i + 1];
      const q = (h - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * q;
    }
  }
  return 1;
}
/* 空の すすみぐあい。∞ のときは、ほんとうの 時刻に あわせる */
function dayF(){
  return LIMIT === Infinity ? clockF() : Math.min(1, tUsed / LIMIT);
}
function phaseKind(ph){ return ph === 0 ? 'bird' : ph === 1 ? 'crow' : 'owl'; }
function perchY(o){ return LINE_Y - (o.kind === 'owl' ? 4.2 : 5.4 * o.sz); }

function spawnSky(now, ph){
  const kind = phaseKind(ph);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const sz = kind === 'owl' ? 1 : kind === 'crow' ? 1.12 : 1;
  const o = { kind: kind, sz: sz, face: dir,
              x: dir > 0 ? -28 : W + 28,
              y: 26 + Math.random() * (LINE_Y - 56),
              v: dir * (kind === 'ufo' ? 0.28 : kind === 'hero' ? 0.92
                        : kind === 'owl' ? 0.42 : 0.52 + Math.random() * 0.36),
              ph: Math.random() * 6.2832, bob: 0.6 + Math.random() * 0.9,
              st: 'pass', t0: now, blink: Math.random() * 6.2832 };
  /* 鳥は よく 線に とまる */
  if(kind !== 'ufo' && kind !== 'hero' && Math.random() < 0.58){
    o.st = 'in';
    o.tx = 34 + Math.random() * (W - 68);
  }
  SKYL.push(o);
}

/* ---- UFO。30秒に 1回くらい やってきて、
        ひとり さらっていくか、ひとり 置いていく ---- */
function spawnUfo(now){
  const dir = Math.random() < 0.5 ? 1 : -1;
  SKYL.push({ kind: 'ufo', sz: 1, face: dir,
              x: dir > 0 ? -36 : W + 36,
              y: 46 + Math.random() * 13,
              v: dir * 0.52, ph: 0, bob: 0, blink: 0,
              st: 'in', t0: now, beam: 0,
              tx: 68 + Math.random() * (W - 136),
              job: Math.random() < LEVELS[curLv()].takeP ? 'take' : 'give' });
}
function ufoAct(o, now){
  if(o.job === 'take'){
    /* UFO の 近くで、いちばん 上のほうにいる子を ひとり */
    /* ひかりの すじの 下にいる子なら、大きい子でも さらわれる */
    let pick = null, bestS = 1e9;
    const near = [];
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      if(b.fly) continue;
      if(Math.abs(b.x - o.x) < 58) near.push(b);
      const sc = Math.abs(b.x - o.x) + b.y * 0.08;
      if(sc < bestS){ bestS = sc; pick = b; }
    }
    if(near.length){
      /* むずかしいほど、大きい子が ねらわれる */
      const w = LEVELS[curLv()].grab;
      let tot = 0;
      const ws = near.map(q => { const v = Math.pow(2, q.t * w); tot += v; return v; });
      let r2 = Math.random() * tot;
      pick = near[near.length - 1];
      for(let i = 0; i < near.length; i++){ r2 -= ws[i]; if(r2 <= 0){ pick = near[i]; break; } }
    }
    if(pick){
      balls = balls.filter(q => q !== pick);
      LIFTS.push({ b: pick, t0: now, ux: o.x, uy: o.y });
      beep(320, 0.5, 0.05, 'sine');
      beep(720, 0.45, 0.04, 'triangle', 0.06);
    } else { o.job = 'give'; ufoAct(o, now); }
  } else {
    /* ひとり 置いていく。UFO の 子は いつも 虹色 */
    const t = Math.random() < .5 ? 0 : Math.random() < .7 ? 1 : 2;
    const nb = makeBall(t, o.x, o.y + 20, 'dog');
    nb.px = nb.x; nb.py = nb.y;
    nb.float = now + 5200;             /* ひかりに のって、のぼるのと おなじ ゆっくりさで */
    nb.rb = true;                      /* UFO の 子は みんな 虹色 */
    beep(784, 0.3, 0.05, 'triangle');
    beep(1046, 0.34, 0.05, 'sine', 0.09);
    beep(1318, 0.4, 0.05, 'sine', 0.19);
    balls.push(nb);
  }
}
function liftStep(k, now){
  for(let i = LIFTS.length - 1; i >= 0; i--){
    const L = LIFTS[i];
    L.b.y -= 1.15 * k;                 /* ゆっくり のぼる */
    L.b.x += (L.ux - L.b.x) * 0.035 * k;
    L.b.rot += 0.02 * k;
    if(L.b.y < L.uy + 2 || L.b.y < -40) LIFTS.splice(i, 1);
  }
}

function skyTick(dt, now, ph){
  const k = Math.min(3, dt / 16.6667);
  liftStep(k, now);
  /* 空をとぶ人は 3分に1回くらい */
  if(!heroNext) heroNext = now + 60000 + Math.random() * 90000;
  else if(now > heroNext){
    heroNext = now + 150000 + Math.random() * 70000;
    const dir = Math.random() < 0.5 ? 1 : -1;
    SKYL.push({ kind: 'hero', sz: 1, face: dir,
                x: dir > 0 ? -34 : W + 34,
                y: 24 + Math.random() * (LINE_Y - 56),
                v: dir * 0.92, ph: Math.random() * 6.2832, bob: 0.8,
                st: 'pass', t0: now, blink: 0 });
  }
  if(!ufoNext) ufoNext = now + 12000 + Math.random() * 9000;
  else if(now > ufoNext && !over){
    const L = LEVELS[curLv()];
    ufoNext = now + L.gap + Math.random() * L.gapR;
    spawnUfo(now);
    /* むずかしいほど、2機で やってくることが ある */
    if(Math.random() < L.duo){
      const o2 = SKYL[SKYL.length - 1];
      spawnUfo(now);
      const o3 = SKYL[SKYL.length - 1];
      o3.face = -o2.face; o3.v = -Math.abs(o3.v) * o2.face;
      o3.x = o3.face > 0 ? -36 - 40 : W + 36 + 40;
      o3.y = o2.y + (o2.y > 42 ? -14 : 14);
      o3.tx = o2.tx > W / 2 ? 60 + Math.random() * 60 : W - 120 + Math.random() * 60;
      o3.job = o2.job === 'take' ? 'give' : 'take';
    }
  }
  if(ph !== skyPh){                     /* 時間が うつると、そっと 入れかわる */
    skyPh = ph;
    for(let i = 0; i < SKYL.length; i++){
      const o = SKYL[i];
      if(o.kind === 'ufo' || o.kind === 'hero') continue;
      if(o.kind !== phaseKind(ph) && o.st === 'perch'){
        o.until = Math.min(o.until, now + 900 + Math.random() * 1600);
      }
    }
  }
  if(now > skyNext){
    skyNext = now + 2400 + Math.random() * 5400;
    if(SKYL.length < 3) spawnSky(now, ph);
  }
  for(let i = SKYL.length - 1; i >= 0; i--){
    const o = SKYL[i];
    o.ph += (o.st === 'perch' ? 0.025 : (o.kind === 'owl' ? 0.13 : 0.2)) * k;
    o.blink += 0.06 * k;
    if(o.kind === 'ufo'){
      if(o.st === 'in'){
        o.x += o.v * k;
        if((o.v > 0 && o.x >= o.tx) || (o.v < 0 && o.x <= o.tx)){
          o.st = 'beam'; o.t0 = now; ufoAct(o, now);
        }
      } else if(o.st === 'beam'){
        o.x += o.v * 0.04 * k;
        o.y += Math.sin(now / 520) * 0.05 * k;
        /* さらう子が のぼりきるまでは、ゆっくり 待つ */
        const span = LIFTS.length ? 7800 : (o.job === 'give' ? 6400 : 3400);
        const q = (now - o.t0) / span;
        o.beam = q < 0.12 ? q / 0.12 : q > 0.88 ? Math.max(0, (1 - q) / 0.12) : 1;
        if(q >= 1 || (o.job === 'take' && !LIFTS.length && now - o.t0 > 2600)){
          o.st = 'out'; o.beam = 0;
        }
      } else {
        o.x += o.v * k;
        o.y -= 0.06 * k;
      }
      if(o.x < -60 || o.x > W + 60) SKYL.splice(i, 1);
      continue;
    }
    if(o.st === 'perch'){
      if(now > o.until){
        o.st = 'off';
        o.face = Math.random() < 0.5 ? -1 : 1;
        o.v = o.face * (0.55 + Math.random() * 0.45);
        o.t0 = now;
      }
    } else if(o.st === 'in'){
      o.x += o.v * k;
      if(o.kind !== 'hero') o.y += Math.sin(o.ph * 0.5) * 0.15 * o.bob * k;
      if((o.v > 0 && o.x >= o.tx) || (o.v < 0 && o.x <= o.tx)){
        o.st = 'land'; o.t0 = now; o.x0 = o.x; o.y0 = o.y;
        o.x1 = o.x + o.v * 15;
      }
    } else if(o.st === 'land'){
      const q = Math.min(1, (now - o.t0) / 720);
      const e = q * q * (3 - 2 * q);
      o.x = o.x0 + (o.x1 - o.x0) * e;
      o.y = o.y0 + (perchY(o) - o.y0) * e;
      if(q >= 1){ o.st = 'perch'; o.until = now + 3600 + Math.random() * 7400; }
    } else {
      o.x += o.v * k;
      if(o.kind !== 'hero'){          /* 空をとぶ人は まっすぐ 水平に */
        o.y += (o.st === 'off' ? -0.24 : Math.sin(o.ph * 0.5) * 0.15 * o.bob) * k;
      }
    }
    if(o.x < -54 || o.x > W + 54 || o.y < -46) SKYL.splice(i, 1);
  }
}

/* ---- お日さま と お月さま ---- */
function drawSunMoon(now, f, night){
  const fs = Math.min(1, f / 0.88);
  const sa = Math.max(0, Math.min(1, 1 - (night - 0.02) * 2.6));
  if(sa > 0.012){
    const warm = fs < 0.42 ? 0 : Math.min(1, (fs - 0.42) / 0.48);
    const x = W * (0.34 + 0.54 * fs);
    const y = 32 + 46 * Math.pow(Math.max(0, fs - 0.35) / 0.65, 2);
    const core = mix('#FFF6CC', '#F98E52', warm);
    const edge = mix('#FFE7A2', '#F2A45E', warm);
    const r = 11 + warm * 2.6;
    ctx.save();
    ctx.globalAlpha = sa;
    const gr = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2.9);
    gr.addColorStop(0, edge.replace('rgb(', 'rgba(').replace(')', ',.42)'));
    gr.addColorStop(1, edge.replace('rgb(', 'rgba(').replace(')', ',0)'));
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r * 2.9, 0, 6.2832); ctx.fill();
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  const ma = Math.max(0, Math.min(1, (night - 0.10) * 2.0));
  if(ma > 0.012){
    const x = W * 0.75, y = 40, r = 12.5;
    ctx.save();
    ctx.globalAlpha = ma;
    const gr = ctx.createRadialGradient(x, y, r * 0.7, x, y, r * 2.6);
    gr.addColorStop(0, 'rgba(255,248,226,.30)');
    gr.addColorStop(1, 'rgba(255,248,226,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 6.2832); ctx.fill();
    /* みかづき */
    const mim = skyArt('moon' + Math.floor(moonPhase() * 60), moonSvgArt());
    if(mim) ctx.drawImage(mim, x - 15, y - 15, 30, 30);
    ctx.restore();
  }
}

/* ---- 空の子を 描く ---- */
function drawSkyOne(o, now){
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(o.sz * (o.face < 0 ? -1 : 1), o.sz);
  const perch = o.st === 'perch';
  const flap = perch ? -0.18 : Math.sin(o.ph) * 0.95;

  if(o.kind === 'ufo'){
    ctx.scale(o.face < 0 ? -1 : 1, 1);          /* UFO は 向きなし */
    if(o.beam > 0.01){                      /* ひかりの すじ */
      const len = H - o.y;
      const gb = ctx.createLinearGradient(0, 2, 0, len);
      gb.addColorStop(0, 'rgba(250,240,186,' + (0.62 * o.beam).toFixed(3) + ')');
      gb.addColorStop(0.55, 'rgba(250,236,170,' + (0.30 * o.beam).toFixed(3) + ')');
      gb.addColorStop(1, 'rgba(250,236,170,0)');
      ctx.fillStyle = gb;
      ctx.beginPath(); ctx.moveTo(-5.5, 2); ctx.lineTo(5.5, 2);
      ctx.lineTo(15 + len * 0.06, len); ctx.lineTo(-15 - len * 0.06, len);
      ctx.closePath(); ctx.fill();
    }
    const uw = 44, uh = uw * 28 / 48, us = uw / 48;
    const uimg = skyArt('ufo', UFO_SVG);
    /* ふわふわ 揺れる（One Step と おなじ うごき） */
    ctx.rotate(Math.sin(now / 1700) * 0.044);
    ctx.translate(0, Math.sin(now / 1700 + 1) * 1.6);
    if(uimg) ctx.drawImage(uimg, -uw / 2, -uh / 2 - 2, uw, uh);
    for(let i = 0; i < UFO_LAMP.length; i++){
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now / 200 - i * 1.1));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#F2DC85';
      ctx.beginPath();
      ctx.arc((UFO_LAMP[i][0] - 24) * us, (UFO_LAMP[i][1] - 14) * us - 2, 1.5 * us, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore(); return;
  }

  if(o.kind === 'hero'){
    const hw = 46, hh = hw * 30 / 64;
    const himg = skyArt('hero', HERO_SVG);
    if(himg) ctx.drawImage(himg, -hw / 2, -hh / 2, hw, hh);
    ctx.restore(); return;
  }

  if(o.kind === 'owl'){
    /* One Step の フクロウ。とまるときは 正面、飛ぶときは 横向き */
    const ow = 30, oh = 30;
    if(perch){
      const im = skyArt('owlSit', OWL_SIT_SVG);
      ctx.scale(o.face < 0 ? -1 : 1, 1);          /* 正面なので 向きは なし */
      if(im) ctx.drawImage(im, -ow / 2, -oh / 2 - 3.4, ow, oh);
    } else {
      const im = skyArt('owlFly', OWL_FLY_SVG);
      /* はばたきは、ゆっくり 上下に のびちぢみ */
      ctx.scale(1, 1 + Math.sin(o.ph) * 0.085);
      if(im) ctx.drawImage(im, -ow / 2, -oh / 2, ow, oh);
    }
    ctx.restore(); return;
  }

  /* 小鳥 と カラス */
  const crow = o.kind === 'crow';
  const body = crow ? '#3C3C46' : '#8FB4CE';
  const wing = crow ? '#2A2A33' : '#6C93B2';
  const beak = crow ? '#5C5C66' : '#E7A85C';
  ctx.fillStyle = body;
  ctx.beginPath();                                /* しっぽ */
  ctx.moveTo(-3.4, -0.4);
  ctx.lineTo(perch ? -8.2 : -9.4, perch ? -3.4 : -2.6);
  ctx.lineTo(-7.8, 1.6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 5.2, 3.6, perch ? -0.16 : 0.06, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(4.2, -2.5, 2.9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = beak;
  ctx.beginPath(); ctx.moveTo(6.6, -2.7); ctx.lineTo(9.6, -1.9); ctx.lineTo(6.6, -1.1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = crow ? '#E8E2D4' : '#3A3A44';
  ctx.beginPath(); ctx.arc(5.1, -3.1, 0.62, 0, 6.2832); ctx.fill();
  ctx.save(); ctx.translate(0.4, -0.9); ctx.rotate(flap);
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.ellipse(-1.2, 0, 4.4, 1.9, 0.1, 0, 6.2832); ctx.fill();
  ctx.restore();
  if(perch){
    ctx.strokeStyle = crow ? '#5C5C66' : '#C9903F';
    ctx.lineWidth = 0.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-0.9, 3.2); ctx.lineTo(-0.9, 5.3);
    ctx.moveTo(1.3, 3.2); ctx.lineTo(1.3, 5.3); ctx.stroke();
  }
  ctx.restore();
}

/* ================== 描く ================== */
function draw(now){
  const sc = cv.width / W;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* そら。時間が すすむほど 夕方、夜へ */
  const sky = skyAt(dayF());
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* 夜が ちかづくと 星 */
  if(sky.night > 0.02){
    ctx.save();
    for(let i = 0; i < STARS.length; i++){
      const st2 = STARS[i];
      const tw = 0.6 + 0.4 * Math.sin(now / 900 + st2.tw);
      ctx.globalAlpha = sky.night * tw * 0.9;
      ctx.fillStyle = '#FFF8E6';
      ctx.beginPath(); ctx.arc(st2.x * W, st2.y * H, st2.s, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }


  bannerTone(sky.night);

  /* お日さま・お月さま */
  drawSunMoon(now, dayF(), sky.night);

  /* つみあげの 線 */
  ctx.save();
  ctx.strokeStyle = 'rgba(178,52,68,' + (0.46 + sky.night * 0.34).toFixed(2) + ')';
  ctx.lineWidth = 1.4; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(0, LINE_Y); ctx.lineTo(W, LINE_Y); ctx.stroke();
  ctx.restore();

  /* UFO に のぼっていく子 */
  for(let i = 0; i < LIFTS.length; i++){
    const L = LIFTS[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, (L.b.y - L.uy) / 46));
    drawBall(L.b, now);
    ctx.restore();
  }

  /* 空の子たち（線に とまる子は 線のうえに） */
  for(let i = 0; i < SKYL.length; i++) drawSkyOne(SKYL[i], now);

  /* 待っている子と、ねらいの すじ */
  if(!over && !idle && cur){
    const x = Math.max(cur.r, Math.min(W - cur.r, aimX));
    ctx.save();
    ctx.strokeStyle = 'rgba(168,138,99,.26)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(x, LINE_Y - 34 + cur.r); ctx.lineTo(x, H); ctx.stroke();
    ctx.restore();
    drawBall({ x: x, y: LINE_Y - 34, r: cur.r, rot: 0, kind: cur.kind,
               ci: cur.ci, bi: cur.bi, pi: cur.pi });
  }

  for(let i = 0; i < balls.length; i++) drawBall(balls[i], now);

  /* お祝いの きらきら */
  for(let i = 0; i < sparks.length; i++){
    const p2 = sparks[i];
    const q = (now - p2.t0) / 2600;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - q) * .9;
    ctx.fillStyle = RB[p2.c];
    ctx.beginPath(); ctx.arc(p2.x, p2.y, 2.6, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* 紙ふぶき */
  for(let i = 0; i < confs.length; i++){
    const c = confs[i];
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    /* ひらひら。横向きになった ときは 細く見える */
    const sx = Math.max(0.16, Math.abs(Math.cos(c.ph)));
    ctx.scale(sx, 1);
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.c;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }

  /* くっついた ところの 光 */
  for(let i = pops.length - 1; i >= 0; i--){
    const p = pops[i];
    const k = (now - p.t0) / 480;
    if(k >= 1){ pops.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = (1 - k) * .55;
    const ph2 = (now * 0.12) % 360;
    ctx.strokeStyle = p.rb ? 'hsl(' + ph2 + ',92%,58%)'
      : p.chain ? '#3F9E6B' : p.bow ? '#A02C3C' : p.same ? '#7FA6C4' : '#C9A87C';
    ctx.lineWidth = 2.4 * (1 - k) + .6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k * .5), 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = (1 - k) * .9;
    ctx.fillStyle = p.rb ? 'hsl(' + ph2 + ',88%,46%)'
      : p.chain ? '#2F8256' : p.bow ? '#A02C3C' : p.same ? '#5D7E96' : '#8B7C6B';
    ctx.font = '700 12px "Space Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+' + p.gain, p.x, p.y - p.r - 6 - k * 14);
    ctx.restore();
  }
}

function drawBall(b, now){
  const img = spriteFor(b);
  const k = b.r / SVG_R;                 /* 絵の 半径 28 を その子の 半径に */
  const w = SVG_W * k, h = SVG_H * k;
  let pop = 1;
  if(now && b.born && now - b.born < 260){
    const q = (now - b.born) / 260;
    pop = 1 + Math.sin(q * Math.PI) * 0.12;
  }
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot || 0);
  ctx.scale(pop, pop);
  if(img){
    if(b.rb && now){
      /* 虹の子は、絵そのものを 虹の色に。耳も ふくめて まるごと */
      const need = w * (cv.width / W);   /* じっさいの 点の かず */
      ctx.drawImage(rbArt(img, (now * 0.042) % 360, need), -SVG_CX * k, -SVG_CY * k, w, h);
    } else {
      ctx.drawImage(img, -SVG_CX * k, -SVG_CY * k, w, h);
    }
  } else {
    ctx.fillStyle = '#E4D8C4';
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
  }
  /* 空へ帰るときは、ひもの ついた 風船になる */
  if(b.fly){
    ctx.save();
    ctx.strokeStyle = 'rgba(120,104,86,.5)';
    ctx.lineWidth = Math.max(0.8, b.r * 0.045);
    ctx.beginPath();
    ctx.moveTo(0, b.r * 0.92);
    ctx.quadraticCurveTo(b.r * 0.3, b.r * 1.5, -b.r * 0.12, b.r * 2.1);
    ctx.stroke();
    ctx.globalAlpha = .42;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-b.r * 0.42, -b.r * 0.2, b.r * 0.12, b.r * 0.26, -0.35, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  /* いちばん大きい子は、ずっと 内がわから 光る。虹の色が ゆっくり めぐる */
  if(now && (b.t >= TOP_T || b.rb) && !b.fly){
    /* クリアの お祝いのあいだは、いつもより 強く 何度か 光る */
    const party = !!(flying && cheerT && now < cheerT);
    const ph = now / (party ? 1050 : 1500);
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(ph * Math.PI));
    const hue = (now * 0.042) % 360;          /* 虹 ひとまわり ≒ 8.5秒 */
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
    /* 虹の子は 絵そのものが 色づくので、光は ひかえめに */
    const soft = b.rb && b.t < TOP_T ? 0.40 : 1;
    gr.addColorStop(0,    'hsla(' + hue + ',100%,86%,'
                          + ((party ? 0.66 : 0.42) * pulse * soft).toFixed(3) + ')');
    gr.addColorStop(0.52, 'hsla(' + hue + ',95%,72%,'
                          + ((party ? 0.40 : 0.26) * pulse * soft).toFixed(3) + ')');
    gr.addColorStop(1,    'hsla(' + hue + ',95%,74%,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* くっついた ばかりの子は、内がわから ふわっと 光る */
  if(now && b.glow){
    const q = (now - b.glow) / GLOW_MS;
    if(q >= 1){ b.glow = 0; }
    else {
      const a = (1 - q) * (1 - q);
      const mid = b.glowC === 'chain' ? '210,255,224'
                : b.glowC === 'bow' ? '255,214,224'
                : b.glowC === 'kind' ? '214,236,255' : '255,232,176';
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
      gg.addColorStop(0,   'rgba(255,252,240,' + (0.92 * a).toFixed(3) + ')');
      gg.addColorStop(0.5, 'rgba(' + mid + ',' + (0.5 * a).toFixed(3) + ')');
      gg.addColorStop(1,   'rgba(' + mid + ',0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, b.r * (1 + q * 0.06), 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ================== 画面まわり ================== */
function fmtT(ms){
  const q = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(q / 60) + ':' + (q % 60 < 10 ? '0' : '') + (q % 60);
}
function paintHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  const tp = document.getElementById('timePill');
  const endless = LIMIT === Infinity;
  const left = endless ? tUsed : LIMIT - tUsed;
  document.getElementById('time').textContent = fmtT(left);
  tp.classList.toggle('low', !endless && left <= 60000);
  const bar = document.querySelector('.bar');
  let c = document.getElementById('clrPill');
  if(clears > 0 && !c){
    c = document.createElement('div');
    c.className = 'pill clr'; c.id = 'clrPill';
    c.innerHTML = '<span class="lab">CLEAR</span><span class="val">0</span>';
    bar.insertBefore(c, document.getElementById('snd'));
  }
  if(c) c.querySelector('.val').textContent = clears;
}
function paintNext(){
  const ic = document.getElementById('nextIc');
  if(!next){ ic.innerHTML = ''; return; }
  ic.innerHTML = KINDS[next.kind].make(next.ci, BOW[next.bi], next.pi);

/* 大きさの わっか。小さい子から 時計まわりに 大きくなる */
function paintChain(){
  const row = document.getElementById('chainRow');
  const n = TIERS.length, R = 35;              /* わっかの 半径（％） */
  let h = '<div class="ring"></div>';
  for(let t = 0; t < n; t++){
    const a = (-90 + t * (360 / n)) * Math.PI / 180;
    const x = 50 + R * Math.cos(a), y = 50 + R * Math.sin(a);
    const px = Math.round(17 + 30 * Math.pow(t / (n - 1), 0.85));
    const art = dogSVG(COATS[TIER_COAT[Math.min(TIER_COAT.length - 1, t)]], BOW[0], 0)
      .replace('width="64" height="70"', 'width="' + px + '"');
    h += '<span style="left:' + x.toFixed(2) + '%; top:' + y.toFixed(2) + '%">' + art + '</span>';
    /* あいだの しるし。さいごと さいしょの あいだは «クリア» */
    const am = (-90 + (t + 0.5) * (360 / n)) * Math.PI / 180;
    const last = t === n - 1;
    const RR = last ? R + 12 : R;
    const mx = 50 + RR * Math.cos(am), my = 50 + RR * Math.sin(am);
    const deg = (-90 + (t + 0.5) * (360 / n)) + 90;
    h += '<em class="' + (last ? 'goal' : '') + '" style="left:' + mx.toFixed(2)
       + '%; top:' + my.toFixed(2) + '%'
       + (last ? '' : '; transform:translate(-50%,-50%) rotate(' + deg.toFixed(1) + 'deg)')
       + '">' + (last ? 'CLEAR' : '›') + '</em>';
  }
  row.innerHTML = h;
}

const KEY = 'paw_ball_game_v1';          /* むかしの さいこう記録 */
const BKEY = 'paw_ball_best_v2';         /* むかしの むずかしさごとの記録 */
const LKEY = 'paw_ball_lv_v1';
const TKEY = 'paw_ball_time_v1';
const RKEY = 'paw_ball_rec_v1';          /* なまえごとの 3分の きろく */
const WKEY = 'paw_ball_who_v1';
let recs = {}, who = '太郎';
function bestOf(name){
  const r = recs[name];
  return r ? (r[BATTLE_LV] | 0) : 0;       /* きろくは 3分バトルの ぶんだけ */
}
function loadBest(){
  try{ soundOn = localStorage.getItem(SKEY) !== '0'; }catch(e){ soundOn = true; }
  try{ const raw = localStorage.getItem(RKEY); if(raw) recs = JSON.parse(raw) || {}; }catch(e){ recs = {}; }
  if(!recs || typeof recs !== 'object') recs = {};
  if(recs['ゲスト'] && !recs['太郎']){ recs['太郎'] = recs['ゲスト']; delete recs['ゲスト']; }
  /* むかしの きろくは «ゲスト» に ひきつぐ */
  if(!Object.keys(recs).length){
    let old = [0, 0, 0];
    try{
      const raw = localStorage.getItem(BKEY);
      if(raw){ const a = JSON.parse(raw); if(Array.isArray(a)) old = [a[0]|0, a[1]|0, a[2]|0]; }
      else old = [0, parseInt(localStorage.getItem(KEY), 10) || 0, 0];
    }catch(e){}
    if(old[0] || old[1] || old[2]) recs['太郎'] = old;
  }
  try{ const w = localStorage.getItem(WKEY); if(w) who = w; }catch(e){}
  if(!recs[who]) recs[who] = [0, 0, 0];
  try{ const n = parseInt(localStorage.getItem(LKEY), 10); if(n >= 0 && n <= 2) lv = n; }catch(e){}
  try{ const n = parseInt(localStorage.getItem(TKEY), 10);
       if(n >= 0 && n < TIMES.length) tm = n; }catch(e){}
  LIMIT = TIMES[tm] || Infinity;
  best = bestOf(who);
}
function saveBest(){
  if(!recs[who]) recs[who] = [0, 0, 0];
  recs[who][BATTLE_LV] = best;
  try{ localStorage.setItem(RKEY, JSON.stringify(recs)); }catch(e){}
  paintRank();
}

/* ---- なまえと、3分の きろく ---- */
function paintRank(){
  const el = document.getElementById('rankList');
  if(!el) return;
  const names = Object.keys(recs).filter(n => bestOf(n) > 0);
  names.sort((a, b) => bestOf(b) - bestOf(a));
  let h = '';
  names.slice(0, 8).forEach((n, i) => {
    h += '<li class="' + (n === who ? 'me' : '') + '">' + crown(i)
       + '<u>' + (i + 1) + '位</u><span>'
       + esc(n) + '</span><i>' + bestOf(n) + '</i></li>';
  });
  if(names.indexOf(who) < 0){
    h += '<li class="me">' + crown(-1) + '<u>-</u><span>' + esc(who)
       + '</span><i>' + bestOf(who) + '</i></li>';
  }
  if(!h) h = '<li class="none">まだ きろくが ありません</li>';
  el.innerHTML = h;
  const btn = document.getElementById('whoBtn');
  if(btn) btn.textContent = who + ' \u25be';
}
/* 1位から 3位は 王冠。金・銀・銅 */
const CROWN_C = ['#E0A526', '#AFB5BB', '#C08552'];
function crown(i){
  if(i < 0 || i > 2) return '<b></b>';
  const c = CROWN_C[i];
  return '<b><svg viewBox="0 0 26 21" aria-hidden="true">'
    + '<path fill="' + c + '" d="M2 17.4 L2 4.2 L7.6 9.4 L13 1.8 L18.4 9.4 L24 4.2 L24 17.4 Z"/>'
    + '<rect x="2" y="17.6" width="22" height="3.2" rx="1.4" fill="' + c + '"/>'
    + '<circle cx="13" cy="11.4" r="1.7" fill="rgba(255,255,255,.55)"/>'
    + '</svg></b>';
}
function esc(t){
  return String(t).replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
}
function setWho(name){
  name = String(name || '').trim().slice(0, 8);
  if(!name) return;
  who = name;
  if(!recs[who]) recs[who] = [0, 0, 0];
  try{ localStorage.setItem(WKEY, who); }catch(e){}
  best = bestOf(who);
  paintHud(); paintRank();
}

function fit(){
  W = 330; H = 465;
  /* 画面の高さに おさまるように。下の一覧まで 見えるように しておく */
  const wrap = document.querySelector('.wrap');
  stage.style.maxWidth = '';
  if(wrap) wrap.style.removeProperty('--boardw');    /* はかる前に もどす */
  const top = stage.getBoundingClientRect().top + (window.scrollY || 0);
  const foot = document.querySelector('.foot');
  const chain = document.querySelector('.chain');
  /* SIZES が よこに ならんでいるときは、その高さを 引かない */
  const sr = stage.getBoundingClientRect();
  const cr = chain ? chain.getBoundingClientRect() : null;
  const side = !!(cr && cr.left >= sr.right - 2);
  const winH = window.innerHeight || 640;
  /* よこに ならんでいる ときだけ、下の ぶんを 引く。
     たての ときは 画面の はばいっぱいに 広げて、下は スクロールで */
  const below = side ? (foot ? foot.offsetHeight : 0) + 34 : 18;
  const avail = Math.max(240, (side ? winH - top - below : winH * 0.94 - top));
  const maxW = stage.clientWidth || 360;
  /* せまい画面でも、小さくしすぎない。足りないぶんは すこし スクロール */
  const minW = Math.min(maxW, 300);
  /* 高さに おさまる いちばん大きい 幅 */
  let wpx = Math.max(minW, Math.min(maxW, Math.floor(avail * W / H)));
  stage.style.maxWidth = wpx + 'px';
  if(wrap && side) wrap.style.setProperty('--boardw', wpx + 'px');
  wpx = stage.clientWidth || wpx;
  const cong = document.getElementById('cong');
  if(cong) cong.firstElementChild.style.fontSize = (wpx * 0.083).toFixed(1) + 'px';
  const cn = document.getElementById('count');
  if(cn){
    cn.querySelector('span').style.fontSize = (wpx * 0.26).toFixed(1) + 'px';
    const rg = cn.querySelector('.ring');
    rg.style.width = rg.style.height = (wpx * 0.50).toFixed(1) + 'px';
  }
  const bn = document.getElementById('bonus');
  if(bn){
    bn.querySelector('i').style.fontSize = (wpx * 0.082).toFixed(1) + 'px';
    bn.querySelector('b').style.fontSize = (wpx * 0.038).toFixed(1) + 'px';
  }
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(wpx * dpr);
  cv.height = Math.round(wpx * dpr * (H / W));
  cv.style.height = Math.round(wpx * (H / W)) + 'px';
}

function toStageX(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}

let pointing = false;
stage.addEventListener('pointerdown', e => {
  /* «つづける»／«もういちど» の ボタンの ときは 板を さわらない。
     さわると ポインタを 板が つかんでしまい、ボタンが 押せなくなる */
  if(over || paused || flying) return;
  if(e.target && e.target.closest && e.target.closest('.over')) return;
  pointing = true;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  aimX = toStageX(e.clientX);
  e.preventDefault();
});
/* カーソルを のせて 動かすだけで、待っている子も ついてくる */
stage.addEventListener('pointermove', e => {
  if(over || paused || flying) return;
  aimX = toStageX(e.clientX);
});
stage.addEventListener('pointerup', e => {
  if(!pointing) return;
  pointing = false;
  aimX = toStageX(e.clientX);
  drop();
});
stage.addEventListener('pointercancel', () => { pointing = false; });

/* 矢印は «押しているあいだ» すーっと 動く。
   押しはじめは ゆっくり、そのまま 押していると 少し はやく */
const KEYD = { left: false, right: false };
let keySpd = 0;
const KEY_SLOW = 0.10, KEY_FAST = 0.44, KEY_ACC = 0.0016;   /* px / ms */
function keyAim(dt){
  const dir = (KEYD.right ? 1 : 0) - (KEYD.left ? 1 : 0);
  if(!dir){ keySpd = 0; return; }
  if(!keySpd) keySpd = KEY_SLOW;
  keySpd = Math.min(KEY_FAST, keySpd + KEY_ACC * dt);
  aimX = Math.max(0, Math.min(W, aimX + dir * keySpd * dt));
}

addEventListener('keydown', e => {
  if(over) return;
  if(e.key === 'ArrowLeft'){ KEYD.left = true; e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ KEYD.right = true; e.preventDefault(); }
  else if(e.key === 'ArrowDown'){ drop(); e.preventDefault(); }       /* 下で おとす */
  else if(e.key === ' ' || e.key === 'Enter'){ drop(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if(e.key === 'ArrowLeft'){ KEYD.left = false; }
  else if(e.key === 'ArrowRight'){ KEYD.right = false; }
});
addEventListener('blur', () => { KEYD.left = KEYD.right = false; keySpd = 0; });

document.getElementById('again').addEventListener('click', () => {
  if(over){ reset(); return; }
  /* クリアの つづき。板は からっぽから、時間と てんすうは そのまま */
  paused = false;
  pointing = false;
  document.getElementById('over').classList.remove('on');
  if(!cur){ cur = newDrop(); next = newDrop(); paintNext(); }
  dropAt = performance.now();
});
document.getElementById('reset').addEventListener('click', () => {
  if(idle) return;
  reset();
});
document.getElementById('quit').addEventListener('click', toIdle);
document.getElementById('startBtn').addEventListener('click', beginGame);
[].forEach.call(document.getElementById('lv').children,
  (b, i) => b.addEventListener('click', () => setLv(i)));
[].forEach.call(document.getElementById('tm').children,
  (b, i) => b.addEventListener('click', () => setTime(i)));
document.getElementById('whoBtn').addEventListener('click', () => openName(false));
document.getElementById('nameOk').addEventListener('click', () => {
  const v = document.getElementById('nameIn').value.trim();
  if(v) setWho(v);
  closeName();
});
document.getElementById('nameClose').addEventListener('click', closeName);
document.getElementById('nameIn').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ setWho(e.target.value || who); closeName(); }
  e.stopPropagation();
});
addEventListener('resize', fit);

/* ================== まわす ================== */
let acc = 0, last = 0, lastSec = -1;
function loop(now){
  if(!last) last = now;
  let dt = now - last; last = now;
  if(dt > 100) dt = 100;
  acc += dt;
  let guard = 0;
  while(acc >= 16.6667 && guard++ < 5){
    if(!over && !paused && !flying) step();
    acc -= 16.6667;
  }
  if(flying) flyStep(dt);
  skyTick(dt, now, phaseOf(dayF()));
  if(!over && !paused && !flying){
    keyAim(dt);
    if(!window.__noTime) tUsed += dt;      /* 見なおし用に 時計を 止められる */
    if(tUsed >= LIMIT){ tUsed = LIMIT; timeOver(); }
    if(Math.floor(tUsed / 1000) !== lastSec){
      lastSec = Math.floor(tUsed / 1000);
      paintHud();
      if(LIMIT !== Infinity){         /* のこり10秒から、1秒ごとに ポーン */
        const left = Math.ceil((LIMIT - tUsed) / 1000);
        if(left <= 10 && left >= 1) sndTick(left);
      }
    }
    checkOver(now);
  }
  draw(now);
  requestAnimationFrame(loop);
}

/* タブや ホーム画面の アイコンは、中くらいの ベージュの 犬ボール */
(function paintIcon(){
  const img = new Image();
  img.onload = function(){
    try{
      const N = 180, c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d');
      x.fillStyle = '#FBF7F0';
      x.fillRect(0, 0, N, N);
      const sc = N * 0.86 / (SVG_R * 2);          /* 顔が ほぼ いっぱいに */
      x.drawImage(img, N / 2 - SVG_CX * sc, N / 2 - SVG_CY * sc + 3,
                  SVG_W * sc, SVG_H * sc);
      const url = c.toDataURL('image/png');
      const a = document.getElementById('favIcon');
      const b = document.getElementById('favTouch');
      if(a) a.href = url;
      if(b) b.href = url;
    }catch(e){}
  };
  img.src = 'data:image/svg+xml;charset=utf-8,'
    + encodeURIComponent(dogSVG(COATS[TOP_COAT], BOW[0], 0));
})();

loadBest();
paintSnd();
paintLv();
paintRank();
paintChain();                    /* 先に 下の一覧を 出してから 高さを合わせる */
fit(); fit();
toIdle();
requestAnimationFrame(loop);

/* デモ・見なおし用の のぞき窓 */
window.__GAME = {
  state: () => ({ n: balls.length, score: score, best: best, over: over,
                  tiers: balls.map(b => b.t), kinds: balls.map(b => b.kind),
                  cis: balls.map(b => b.ci), aim: +aimX.toFixed(2),
                  topY: balls.length ? Math.min.apply(null, balls.map(b => b.y - b.r)) : null,
                  line: LINE_Y, boardH: H,
                  moving: balls.filter(b =>
                    Math.abs(b.y - b.py) + Math.abs(b.x - b.px) >= 1.2).length,
                  balls: balls.map(b => ({ t: b.t, x: +b.x.toFixed(1),
                                           y: +b.y.toFixed(1), r: b.r })) }),
  cur: () => cur && { t: cur.t, r: cur.r },
  clears: () => clears,
  left: () => LIMIT - tUsed,
  lv: () => lv,
  elv: () => curLv(),
  setLv: n => setLv(n),
  noTime: on => { window.__noTime = !!on; },
  aim: x => { aimX = x; },
  aimNow: () => +aimX.toFixed(2),
  drop: () => { dropAt = 0; drop(); },
  put: (t, x, kind) => { const b = makeBall(t, x, LINE_Y + 10, kind); balls.push(b); return b.id; },
  sky: () => ({ fill: fillT, rain: rain, flying: !!flying }),
  setT: ms => { tUsed = Math.max(0, Math.min(LIMIT, ms)); paintHud(); },
  atF: f => { tUsed = Math.max(0, Math.min(1, f)) * LIMIT; paintHud(); },
  hour: h => { window.__hour = h; },
  dayF: () => +dayF().toFixed(3),
  skyList: () => SKYL.map(o => ({ k: o.kind, st: o.st, x: +o.x.toFixed(1),
                                  y: +o.y.toFixed(1), job: o.job || '' })),
  lifts: () => LIFTS.length,
  rbs: () => balls.filter(b => b.rb).length,
  rbNow: () => { rbNext = -1; },
  mark: id => { const b = balls.filter(q => q.id === id)[0]; if(b) b.rb = true; },
  spawn: k => { const now = performance.now();
    if(k === 'ufo'){ spawnUfo(now); return; }
    spawnSky(now, k === 'bird' ? 0 : k === 'crow' ? 1 : 2);
    const o = SKYL[SKYL.length - 1]; o.kind = k;
    if(k === 'hero'){ o.st = 'pass'; o.v = o.face * 0.92; } },
  ufoJob: j => { const now = performance.now(); spawnUfo(now);
    const o = SKYL[SKYL.length - 1]; o.job = j; o.v = o.v * 3; return o.tx; },
  rush: ms => { tUsed = Math.min(LIMIT, tUsed + ms); paintHud(); },
  glowAll: () => { const t = performance.now();
    balls.forEach(b => { b.glow = t; b.glowC = 'plain'; }); },
  reset: reset,
  idle: () => idle,
  start: () => beginGame(),
  quit: () => toIdle()
};
})();
