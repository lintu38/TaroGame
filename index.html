<link rel="apple-touch-icon" id="favTouch" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TARO GAME">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --bg-soft:#F6EFE4; --bg-card:#FFFDF8;
    --line:#EFE6D6; --beige:#C9A87C; --beige-deep:#A88A63;
    --text:#4B4038; --text-muted:#8B7C6B; --text-faint:#B8AC9A;
    --sky-a:#EAF1F3; --sky-b:#F7F1E6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    overflow-x:hidden; width:100%; max-width:100%;
    touch-action:manipulation;          /* 二度たたきの 拡大を とめる */
    overscroll-behavior-x:none;
    font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
    overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; align-items:center;
    padding:8px 12px calc(14px + env(safe-area-inset-bottom)); min-height:100dvh; }
  /* スマホでは 板を すこし 広く */
  @media (max-width:700px){
    body{ padding-left:5px; padding-right:5px; }
  }

  .head{ text-align:center; margin:0 0 6px; }
  .head h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.04em;
    font-family:'Comfortaa','Zen Kaku Gothic New',cursive; }
  .head h1 .t-paw{ display:inline-block; line-height:0; margin:0 7px; vertical-align:-3px; }
  .head h1 .t-paw svg{ width:23px; height:20px; display:block; fill:#C7AC87; opacity:.9; }
  .head p{ margin:3px 0 0; font-size:11.5px; color:var(--text-muted); }

  .wrap{ width:100%; max-width:min(520px, 100%); }

  /* 画面の広い パソコンでは、SIZES を よこに置いて
     そのぶん 遊ぶ板を 大きく する */
  @media (min-width:880px) and (min-height:620px){
    .wrap{ max-width:none; width:auto; display:grid; align-items:start;
      gap:0 22px;
      grid-template-columns:var(--boardw, minmax(300px,560px)) 300px;
      grid-template-areas:"bar ." "who ." "stage side" "foot side"; }
    .whorow{ grid-area:who; }
    .bar{ grid-area:bar; }
    .stage{ grid-area:stage; }
    .foot{ grid-area:foot; }
    .side{ grid-area:side; }
    .side .chain:first-child{ margin-top:0; }
    .head h1{ font-size:22px; }
    .foot .hint{ font-size:14.5px; }
  }

  .bar{ display:flex; align-items:stretch; gap:7px; margin-bottom:7px; }
  .pill{ flex:1 1 0; min-width:0; overflow:hidden; background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:13px; padding:6px 11px; display:flex; align-items:baseline; gap:7px; }
  .pill .lab, .pill .val{ white-space:nowrap; }
  .pill .lab{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em;
    color:var(--beige-deep); }
  .pill .val{ font-family:'Space Mono',monospace; font-size:17px; font-weight:700;
    margin-left:auto; }
  .pill.best .val{ color:var(--text-muted); font-size:15px; }
  .pill.time{ flex:0 1 auto; }
  .pill.time .val{ font-size:15px; margin-left:4px; }
  .pill.time.low .val{ color:#A02C3C; }
  /* 3分バトルの のこり時間は 目立たせる */
  .pill.time.batt{ background:linear-gradient(135deg,#F7E4D0,#F1D4B6);
    border-color:#E3BB92; flex:1 1 auto; padding-right:13px; }
  .pill.time.batt .lab{ color:#A2622C; }
  .pill.time.batt .val{ color:#8C4E1C; font-size:20px; letter-spacing:.02em; }
  .pill.time.batt.low{ background:linear-gradient(135deg,#F6D9D3,#EFC3BB); border-color:#DFA79D; }
  .pill.time.batt.low .val{ color:#A02C3C; }
  .pill.clr{ flex:0 1 auto; }
  .pill.clr .val{ color:#A02C3C; font-size:15px; margin-left:4px; }
  .snd{ flex:0 0 auto; width:40px; border:1px solid var(--line); border-radius:13px;
    background:var(--bg-card); color:var(--beige-deep); cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .snd svg{ width:19px; height:19px; display:block; fill:currentColor; }
  .snd svg .wav, .snd svg .cut{ fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linecap:round; }
  .snd svg .cut{ display:none; }
  .snd.off{ color:var(--text-faint); }
  .snd.off svg .wav{ display:none; }
  .snd.off svg .cut{ display:block; }
  .snd:active{ transform:scale(.95); }

  .stage{ position:relative; width:100%; margin:0 auto; background:var(--bg-card);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 12px 30px -24px var(--beige-deep); touch-action:none; }
  canvas{ display:block; width:100%; height:auto; }

  /* つぎの子 */
  /* せまい画面では、CLEAR が ふえても 一列に おさまるように */
  @media (max-width:470px){
    .bar{ gap:5px; }
    .pill{ padding:6px 8px; gap:5px; }
    .pill .lab{ font-size:8.5px; letter-spacing:.1em; }
    .pill .val{ font-size:15px; }
    .pill.best .val, .pill.time .val, .pill.clr .val{ font-size:13px; }
    .snd{ width:34px; }
    .snd svg{ width:17px; height:17px; }
  }
  .stage.idle .next{ display:none; }
  .next{ position:absolute; left:10px; top:9px; display:flex; align-items:center; gap:7px;
    background:rgba(255,253,248,.82); border:1px solid var(--line); border-radius:99px;
    padding:4px 11px 4px 5px; pointer-events:none; }
  .next i{ width:26px; height:26px; display:block; }
  .next i svg{ width:100%; height:100%; display:block; }
  .next b{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em;
    color:var(--beige-deep); font-weight:400; }

  /* クリアした しゅんかんの 大きな文字 */
  .cong{ position:absolute; left:0; right:0; top:26%; display:none;
    justify-content:center; pointer-events:none; }
  .cong.on{ display:flex; }
  .cong span{ font-family:'Space Mono',monospace; font-weight:700;
    font-size:26px; letter-spacing:.02em; white-space:nowrap;
    color:#8A6A46;
    text-shadow:0 4px 12px rgba(120,100,80,.20);
    animation:congIn .62s cubic-bezier(.2,1.5,.5,1) both, congFloat 2.1s .62s ease-in-out infinite; }
  @keyframes congIn{
    0%{ transform:scale(.4) rotate(-7deg); opacity:0; }
    70%{ transform:scale(1.12) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes congFloat{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-5px) scale(1.035); } }

  /* 風船が 空へ帰るときの ボーナス */
  .bonus{ position:absolute; left:0; right:0; top:41%; display:none;
    justify-content:center; align-items:baseline; gap:9px; pointer-events:none; }
  .bonus.on{ display:flex; }
  .bonus b{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.16em;
    color:#8A6A46; }
  .bonus i{ font-family:'Space Mono',monospace; font-weight:700; font-style:normal;
    font-size:26px; color:#6A4AA0; transform-origin:50% 60%;
    text-shadow:0 4px 10px rgba(120,100,80,.20); }
  .bonus.pop i{ animation:bnPop .24s cubic-bezier(.2,1.6,.5,1); }
  @keyframes bnPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.28); }
    100%{ transform:scale(1); } }

  /* 3・2・1 の かぞえ */
  .count{ position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    color:#6A4AA0; }
  .count.on{ display:grid; }
  .count > *{ grid-area:1 / 1; }
  .count span{ font-family:'Space Mono',monospace; font-weight:700; font-size:84px;
    color:inherit; line-height:1; animation:cnPop .62s ease-out both; }
  /* まわる タイムバー */
  .count .ring{ width:168px; height:168px; transform:rotate(-90deg); overflow:visible; }
  .count .ring circle{ fill:none; stroke-width:4.4; stroke-linecap:round; }
  .count .ring .bg{ stroke:currentColor; opacity:.16; }
  .count .ring .fg{ stroke:currentColor; stroke-dasharray:276.46;
    animation:cnRing .78s linear both; }
  @keyframes cnRing{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:276.46; } }
  @keyframes cnPop{
    0%{ transform:scale(1.8); opacity:0; }
    26%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(.92); opacity:.55; } }

  /* はじめる ボタン。ふわふわ 光る */
  .over.start{ background:rgba(251,247,240,.34); backdrop-filter:none; }
  .over.start .box{ padding:0; }
  .startBtn{ width:146px; height:146px; border-radius:50%; padding:13% 0 0;
    cursor:pointer; background:#FAF2E4; border:2px solid #E2CFAE; box-shadow:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    animation:stGlow 2.1s ease-in-out infinite; }
  .startBtn .ico{ display:block; line-height:0; width:20%; max-width:32px; }
  .startBtn .ico.xm{ width:25%; max-width:40px; }   /* サンタ帽の ぶん */
  .startBtn .ico svg{ width:100%; height:auto; display:block; }
  .startBtn b{ font-family:'Comfortaa','Zen Kaku Gothic New',cursive; font-weight:700;
    font-size:22px; letter-spacing:.1em; color:#8A6437; padding-left:.1em; }
  .startBtn:active{ transform:scale(.97); }
  @keyframes stGlow{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 0 rgba(233,200,140,0)); }
    50%{ transform:scale(1.045); filter:drop-shadow(0 0 17px rgba(233,200,140,.8)); } }

  /* なまえの 板は 画面ぜんたいに（スマホでも まんなかに 出る） */
  .namebox{ position:fixed; z-index:60; }
  .over{ position:absolute; inset:0; display:none; place-items:center;
    background:rgba(251,247,240,.86); backdrop-filter:blur(2px); }
  .over.on{ display:grid; }
  .over .box{ text-align:center; padding:20px 26px; }
  .over .box h2{ margin:0 0 4px; font-size:16px; font-weight:700; }
  .over .box .ovic{ width:62px; height:62px; margin:0 auto 6px; line-height:0; }
  .over .box .ovic svg{ width:100%; height:100%; display:block; }
  .over .box .ovic:empty{ display:none; }
  .over .box p{ margin:0 0 3px; font-size:12px; color:var(--text-muted); }
  .over .box .sc{ font-family:'Space Mono',monospace; font-size:30px; font-weight:700;
    margin:6px 0 2px; }
  .over .box .new{ font-size:11px; color:#A02C3C; margin-bottom:8px; }

  .btn{ font-family:inherit; font-size:12.5px; color:#fff; border:0; cursor:pointer;
    background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    border-radius:99px; padding:9px 22px; box-shadow:0 8px 18px -12px var(--beige-deep); }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:var(--bg-card); color:var(--text-muted);
    border:1px solid var(--line); box-shadow:none; }

  .foot{ display:flex; align-items:center; gap:7px; margin-top:7px; flex-wrap:wrap; }
  .foot .hint{ flex:1 1 190px; margin:0; font-size:12.5px; font-weight:500;
    color:var(--text-muted); line-height:1.55; }

  /* むずかしさ */
  .lv{ display:flex; background:var(--bg-card); border:1px solid var(--line);
    border-radius:99px; padding:2px; gap:2px; }
  .lv button{ font-family:inherit; font-size:11px; color:var(--text-muted);
    background:none; border:0; border-radius:99px; padding:6px 10px; cursor:pointer; }
  #tm button:last-child{ font-size:19px; line-height:1; padding:4px 16px 7px; }
  .lv button.on{ background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    color:#fff; }
  /* あそびかた（3分バトル / ∞）は 目立たせる */
  .lv.mode{ border-color:var(--beige); box-shadow:0 6px 16px -12px var(--beige-deep); }
  .lv.mode button{ font-size:13px; font-weight:700; padding:8px 16px; }
  .lv.mode button.on{ box-shadow:0 4px 10px -6px rgba(120,100,80,.5); }
  /* 3分バトルは くすみオレンジ、∞ は くすみシアン */
  #tm button:first-child.on{ background:linear-gradient(135deg,#E3A56C,#C87F45); }
  #tm button:last-child.on{ background:linear-gradient(135deg,#8CC0C4,#5E9BA4); }
  #lv.hide{ display:none; }

  /* きろく と 進化の輪 */
  .side{ display:block; }
  .mini{ flex:0 0 auto; font-family:inherit; font-size:11.5px; cursor:pointer;
    color:#fff; border:0; border-radius:99px; padding:5px 13px;
    font-weight:700; letter-spacing:.02em;
    background:linear-gradient(135deg,#D2BB99,var(--beige) 60%,var(--beige-deep));
    box-shadow:0 6px 14px -9px var(--beige-deep); }
  .mini:active{ transform:scale(.96); }
  /* いちばんの 記録たち */
  .topline{ display:flex; align-items:center; gap:7px; margin:0 0 6px;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    padding:7px 10px; }
  .topline .lab{ font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.13em;
    color:var(--beige-deep); white-space:nowrap; }
  .topline .lab.jp{ font-family:inherit; font-size:11px; letter-spacing:.02em; }
  .topline .inf{ font-size:17px; line-height:1; color:var(--beige-deep); }
  .topline .cr{ width:18px; height:15px; line-height:0; flex:0 0 18px; margin-left:auto; }
  .topline .cr svg{ width:18px; height:15px; display:block; }
  .topline .nm{ font-size:13px; font-weight:700; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topline .nm.pad{ margin-left:auto; }
  .topline .sc{ font-family:'Space Mono',monospace; font-size:17px; font-weight:700;
    color:var(--text); margin-left:6px; }
  .topline .none{ margin-left:auto; font-size:11.5px; color:var(--text-faint); }
  /* クリアまでの時間（むずかしさごと） */
  .fastbox{ background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    padding:7px 10px 5px; margin:0 0 6px; }
  .fastbox .fhead{ display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  .fastbox .inf{ font-size:17px; line-height:1; color:var(--beige-deep); }
  .fastbox .lab{ font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.13em;
    color:var(--beige-deep); white-space:nowrap; }
  .fastbox .lab.jp{ font-family:inherit; font-size:11px; letter-spacing:.02em; }
  .frow{ display:flex; align-items:center; gap:6px; padding:2px 1px; }

  #nameBox .box p{ margin-bottom:8px; }
  #nameBox input{ font-family:inherit; font-size:14px; text-align:center; color:var(--text);

    font-size:11px; transform:translate(-50%,-50%); }

<body>

<div class="head">
  <h1>TARO<span class="t-paw"><svg viewBox="0 0 40 34" aria-hidden="true"><ellipse cx="20" cy="25" rx="8.6" ry="7"/><ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/><ellipse cx="16.5" cy="8" rx="3.7" ry="5"/><ellipse cx="24.5" cy="8" rx="3.7" ry="5"/><ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/></svg></span>GAME</h1>
</div>

<div class="wrap">

  </div>
</div>

<script>
(function(){
'use strict';

/* ================== 絵 ================== */
/* One Step の «かご» の子と おなじ描きかた。
   ボールは 64x70 の絵で、まるい顔の中心が (32,36)、半径 28。 */
const SVG_W = 64, SVG_H = 70, SVG_CX = 32, SVG_CY = 36, SVG_R = 28;

/* 毛色は 大きさで きまる。小さい子は 濃い茶、大きくなるほど 淡く。
   あいだに グレーが ふたつ。いちばん大きい子は 中くらいの濃さの ベージュ */
const COATS = (function(){
  /* 下半分（顔と口もと）は みんな おなじ。One Step の子と おなじ色 */
  const FACE = '#EDE6D6', MUZ = '#F5F0E4';
  const TOPS = [
    ['#DCC29E', '#F0E2CC'],   /* 0 うすい ベージュ（いちばん小さい子） */
    ['#A07348', '#CBA87F'],   /* 1 茶 */
    ['#8E8B85', '#BAB7B1'],   /* 2 濃いグレー */
    ['#B8925F', '#D8BB92'],   /* 3 明るい茶 */
    ['#C9A87C', '#E4D2B4'],   /* 4 ベージュ */
    ['#C3C0BA', '#DEDCD7'],   /* 5 薄いグレー */
    ['#D3B183', '#E9D7B8'],   /* 6 こいめの ベージュ ← いちばん大きい子 */
    ['#E0CCAB', '#F0E6D4'],   /* 7 淡いベージュ（クリアの ひとつ手前） */
    ['#C4514A', '#DE8079'],   /* 8 クリスマスの あか */
    ['#3F7A52', '#68A278']    /* 9 クリスマスの みどり */
  ];
  return TOPS.map(t => ({ coat: t[0], earIn: t[1], face: FACE, muz: MUZ }));
})();
/* 大きさ（段）ごとの 毛色 */
const TIER_COAT = [0, 1, 2, 3, 4, 5, 7, 6];
const TOP_COAT = 6;                    /* いちばん大きい子は 中くらいの濃さの ベージュ */
const BOW = ['#799837', '#875b1b', '#3e8299', '#ad465f', '#a4891e', '#36517d', '#743034'];
const BOWPOS = ['translate(13,-34.6) rotate(24 32 47.6)', 'translate(0,13.4)'];

const HEAD =
  '<defs><radialGradient id="g" cx="33%" cy="26%" r="76%">'
  + '<stop offset="0" stop-color="#fff" stop-opacity=".34"/>'
  + '<stop offset=".4" stop-color="#fff" stop-opacity=".10"/>'
  + '<stop offset=".76" stop-color="#fff" stop-opacity="0"/>'
  + '<stop offset="1" stop-color="#8C7457" stop-opacity=".2"/>'
  + '</radialGradient></defs>';
const SHINE = '<ellipse cx="32" cy="36" rx="28.5" ry="27.5" fill="url(#g)"/>';

function eyes(){
  return '<ellipse cx="20.4" cy="33.4" rx="3.5" ry="4" fill="#372C22"/>'
       + '<ellipse cx="43.6" cy="33.4" rx="3.5" ry="4" fill="#372C22"/>'
       + '<ellipse cx="22" cy="31.6" rx="1.1" ry="1.3" fill="#fff" opacity=".85"/>'
       + '<ellipse cx="45.2" cy="31.6" rx="1.1" ry="1.3" fill="#fff" opacity=".85"/>';
}
/* リボン（色が そろうと てんすう2ばい）。すこし 大きめに */
function bowTag(bow, pos){
  if(!bow) return '';
  return '<g transform="' + BOWPOS[pos ? 1 : 0] + '">'
    + '<g transform="translate(32,48) scale(1.28) translate(-32,-48)">'
    + '<path d="M32 47.6c-3.6-3.4-8-2.7-8 .7 0 3.1 4.7 3.8 8 .9 3.3 2.9 8 2.2 8-.9 '
    +   '0-3.4-4.4-4.1-8-.7Z" fill="' + bow + '"/>'
    + '<circle cx="32" cy="48.5" r="1.9" fill="' + bow + '" '
    +   'stroke="rgba(255,255,255,.5)" stroke-width=".7"/></g></g>';
}

const OPEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 70" width="64" height="70">';

/* ---- 犬 ---- */
function dogSVG(c, bow, pos){
  return OPEN + HEAD
    + '<path d="M15.4 6.4 25.6 13.6 18 22.6Z" fill="' + c.coat + '"/>'
    + '<path d="M48.6 6.4 38.4 13.6 46 22.6Z" fill="' + c.coat + '"/>'

    + '<ellipse cx="32" cy="36" rx="28.5" ry="27.5" fill="' + c.face + '"/>'
    + '<path d="M32 8.5c-15.7 0-28.5 12.3-28.5 27.5 0 1.6.1 3.2.4 4.7 '
    +   '6.4 2.6 12.6 3.4 18.5 2.5 4.2-.7 7.4-2.8 9.6-6.3 2.2 3.5 5.4 5.6 9.6 6.3 '
    +   '5.9.9 12.1.1 18.5-2.5.3-1.5.4-3.1.4-4.7C60.5 20.8 47.7 8.5 32 8.5z" fill="' + c.coat + '"/>'
    + '<ellipse cx="21.6" cy="21.6" rx="4.6" ry="2.9" fill="' + c.face + '"/>'

    + eyes()
    + '<ellipse cx="32" cy="39.4" rx="9.6" ry="8.6" fill="' + c.muz + '"/>'

    + SHINE + bowTag(bow, pos) + '</svg>';
}

/* ---- ねこ ---- */
function catSVG(bow, pos){
  /* 三毛猫。白地に 茶と黒の ぶち */
  const coat = '#E2A05C', earIn = '#E3B7BE', face = '#F8F3EB', muz = '#FFFCF6';
  return OPEN + HEAD
    + '<path d="M14.6 4.4 26.4 12.6 17.6 22.4Z" fill="#514A50"/>'

    +   '5.4 1.4 11.6 1.3 18.6-.3.3-1.8.5-3.6.5-5.5C60.5 20.8 47.7 8.5 32 8.5z" fill="' + coat + '"/>'
    + '<ellipse cx="17.8" cy="19.4" rx="10.4" ry="7.2" fill="#514A50" '
    +   'transform="rotate(-20 17.8 19.4)"/>'
    + '<ellipse cx="44.8" cy="20.6" rx="7" ry="5.4" fill="#F8F3EB" '

    + eyes()
    + '<ellipse cx="32" cy="39.6" rx="8.8" ry="7.6" fill="' + muz + '"/>'
    + '<path d="M32 33.6 28.9 36.9h6.2Z" fill="#B4737C"/>'

    + '<g stroke="#B9AFA3" stroke-width="1" stroke-linecap="round" opacity=".85">'
    +   '<path d="M22.6 38.5 14.4 36.7M22.6 41 14.6 41.6M41.4 38.5 49.6 36.7M41.4 41 49.4 41.6"/></g>'
    + SHINE + bowTag(bow, pos) + '</svg>';
}

/* ---- うさぎ ---- */
function rabSVG(bow, pos){
  const coat = '#EDE7E0', earIn = '#E7BCC4', face = '#FBF8F4', muz = '#FFFDFB';
  return OPEN + HEAD
    + '<ellipse cx="22.2" cy="10.6" rx="4.6" ry="11" fill="' + coat + '" '
    +   'transform="rotate(-13 22.2 10.6)"/>'
    + '<ellipse cx="41.8" cy="10.6" rx="4.6" ry="11" fill="' + coat + '" '

    + '<ellipse cx="22.4" cy="11.4" rx="2" ry="7" fill="' + earIn + '" '
    +   'transform="rotate(-13 22.4 11.4)"/>'
    + '<ellipse cx="41.6" cy="11.4" rx="2" ry="7" fill="' + earIn + '" '
    +   'transform="rotate(13 41.6 11.4)"/>'
    + '<ellipse cx="32" cy="36" rx="28.5" ry="27.5" fill="' + face + '"/>'
    + '<path d="M32 8.5c-15.7 0-28.5 12.3-28.5 27.5 0 1.4.1 2.8.3 4.2 '
    +   '6.6 2 12.8 2.3 18.4 1 4.2-1 7.4-3 9.8-6 2.4 3 5.6 5 9.8 6 '

    + eyes()
    + '<ellipse cx="32" cy="39.8" rx="8.6" ry="7.4" fill="' + muz + '"/>'

/* ---- ことり ---- */
/* 夜の フクロウ玉 */
function owlSVG(bow, pos){
  const coat = '#8B7A66', face = '#CBBAA0', disc = '#EADFCB', wing = '#736450';
  return OPEN + HEAD
    + '<path d="M13.6 10.2 17.4 1.6 24.6 8.4Z" fill="' + coat + '"/>'
    + '<path d="M50.4 10.2 46.6 1.6 39.4 8.4Z" fill="' + coat + '"/>'
    + '<ellipse cx="32" cy="36" rx="28.5" ry="27.5" fill="' + face + '"/>'
    + '<path d="M32 8.5c-15.7 0-28.5 12.3-28.5 27.5 0 2.4.3 4.7.9 6.9 '
    +   '7.4 2.2 13.8 2.2 19.2-.2 3.6-1.6 6.4-4 8.4-7.2 2 3.2 4.8 5.6 8.4 7.2 '
    +   '5.4 2.4 11.8 2.4 19.2.2.6-2.2.9-4.5.9-6.9C60.5 20.8 47.7 8.5 32 8.5z" fill="' + coat + '"/>'
    + '<ellipse cx="9.8" cy="40" rx="5.6" ry="8.4" fill="' + wing + '" '
    +   'transform="rotate(16 9.8 40)"/>'
    + '<circle cx="21.6" cy="33" r="9.2" fill="' + disc + '"/>'
    + '<circle cx="42.4" cy="33" r="9.2" fill="' + disc + '"/>'
    + '<circle cx="21.6" cy="33" r="5" fill="#372C22"/>'

function rbArt(img, hue, need){
  const pw = Math.max(96, Math.min(640, Math.ceil(need / 48) * 48));
  const ph = Math.round(pw * SVG_H / SVG_W);
  if(rbCv.width !== pw){ rbCv.width = pw; rbCv.height = ph; }
  rbCx.setTransform(1, 0, 0, 1, 0, 0);
  rbCx.clearRect(0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'source-over';
  rbCx.drawImage(img, 0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'color';
  rbCx.fillStyle = 'hsl(' + hue.toFixed(0) + ',95%,55%)';
  rbCx.fillRect(0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'destination-in';   /* 絵の かたちだけ のこす */
  rbCx.drawImage(img, 0, 0, pw, ph);
  rbCx.globalCompositeOperation = 'source-over';
  return rbCv;
}

let soundOn = true, actx = null;
function audio(){
  if(!actx){
    const A = window.AudioContext || window.webkitAudioContext;
    if(!A) return null;
    actx = new A();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
/* やわらかい ひと粒。くっついた 大きさで 音が上がっていく */
function beep(freq, dur, vol, type, delay){
  if(!soundOn) return;
  const c = audio(); if(!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];

/* ---- 一歩すすめる ---- */
function step(){
  const n = balls.length;
  for(let i = 0; i < n; i++){
    const b = balls[i];
    let vx = (b.x - b.px) * DAMP;
    let vy = (b.y - b.py) * DAMP;
    if(vx > 22) vx = 22; if(vx < -22) vx = -22;
    if(vy > 26) vy = 26; if(vy < -26) vy = -26;
    b.px = b.x; b.py = b.y;
    if(b.float){                       /* UFO が そっと 降ろしている あいだ */
      if(performance.now() > b.float) b.float = 0;
      else { b.y += 1.15; b.py = b.y - 1.15; b.rot += b.spin * 0.3; continue; }
    }
    b.x += vx; b.y += vy + GRAV;
    b.rot += b.spin + vx * 0.004;
    b.spin *= 0.97;
  }

  for(let it = 0; it < ITER; it++){
    /* 子どうし */
    for(let i = 0; i < balls.length; i++){
      const a = balls[i];
      for(let j = i + 1; j < balls.length; j++){
        const b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        if(Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
        let d2 = dx * dx + dy * dy;
        if(d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2);

        /* おなじ大きさで おなじ子なら くっつく。
           いちばん大きい子どうしは、ぽんと はじけて 消える */
        /* くっつくのは «いぬ» どうしだけ。じゃまの子は くっつかない */
        if(a.t === b.t && a.kind === 'dog' && b.kind === 'dog'
           && !a.gone && !b.gone && it === 0){
          merge(a, b);
          i = -1;       /* 並びが変わるので 見なおす */
          break;
        }
        a.touch = b.touch = true;      /* だれかに あたった子 */
        a.float = b.float = 0;         /* ひかりから おりた */
        const ov = (rr - d) / d * 0.5;
        const ma = b.r * b.r, mb = a.r * a.r, tot = ma + mb;
        const sx = dx * ov, sy = dy * ov;
        a.x -= sx * (2 * ma / tot); a.y -= sy * (2 * ma / tot);
        b.x += sx * (2 * mb / tot); b.y += sy * (2 * mb / tot);
      }
      if(i === -1) break;
    }
    /* かべと ゆか */
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      if(b.x < b.r){ const v = b.px - b.x; b.x = b.r; b.px = b.x - v * WALL; }
      if(b.x > W - b.r){ const v = b.px - b.x; b.x = W - b.r; b.px = b.x - v * WALL; }
      if(b.y > H - b.r){ const v = b.py - b.y; b.y = H - b.r; b.py = b.y - v * FLOOR;
                         b.touch = true; b.float = 0; }
      /* 天井。おしくらまんじゅうで 上へ とびだしてしまわないように */
      if(b.y < b.r * 0.6){ const v = b.py - b.y; b.y = b.r * 0.6; b.py = b.y - v * 0.2; }
    }
  }
}

function merge(a, b){
  if(window.__MLOG) window.__MLOG.push([a.t, b.t, a.r, b.r]);
  a.gone = b.gone = true;
  const t = a.t + 1;
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  if(a.t >= TOP_T){
    /* いちばん大きい子が ふたり そろうと、はじけて 空へ帰る */
    const gain = PTS[TOP_T] * 4;
    score += gain;
    sndPop();
    balls = balls.filter(q => q !== a && q !== b);
    pops.push({ x: x, y: y, r: a.r * 1.3, t0: performance.now(), gain: gain, same: true });
    paintHud();
    return;
  }
  /* 特別な子は その子のまま 大きくなる。リボンの色まで そろうと なおよし */
  const bowSame = a.bi === b.bi;
  /* まだ 光っている子どうしを つなげると、れんさで もっと はずむ */
  const tn = performance.now();
  const chain = !!(a.glow && tn - a.glow < GLOW_MS) && !!(b.glow && tn - b.glow < GLOW_MS);
  const nb = makeBall(t, x, y, 'dog');
  if(bowSame) nb.bi = a.bi;              /* そろったリボンは 受けつがれる */
  if(a.rb || b.rb){ nb.rb = true; }      /* 虹の光も 受けつがれる */
  nb.px = x + (a.px - a.x + b.px - b.x) * 0.25;
  nb.py = y + (a.py - a.y + b.py - b.y) * 0.25 + 1.6;   /* ぽん、と すこし はねる */
  /* 虹の子が まざると 3ばい。虹どうしなら 5ばい */
  const rb = !!(a.rb || b.rb), rb2 = !!(a.rb && b.rb);
  const gain = PTS[t] * (bowSame ? 2 : 1) * (chain ? 3 : 1) * (rb2 ? 5 : rb ? 3 : 1)
             * (t >= TOP_T ? 7 : 1);           /* クリアの 合体は 7ばい */
  score += gain;
  /* 合体した子は 内がわから 光る */
  nb.glow = tn;
  nb.glowC = chain ? 'chain' : bowSame ? 'bow' : 'plain';
  balls = balls.filter(q => q !== a && q !== b);
  balls.push(nb);
  pops.push({ x: x, y: y, r: nb.r, t0: tn, gain: gain,
              same: bowSame, bow: bowSame, chain: chain, rb: rb });
  sndMerge(t, false, bowSame, chain);
  if(rb2){
    /* 虹どうし。ちいさな お祝い */
    [659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
      beep(f, 0.42, 0.075, 'triangle', i * 0.085));
    confetti(20);
    puff(14, Math.max(LINE_Y, y - 50), y + 50);
  } else if(rb){
    beep(1046, 0.26, 0.05, 'triangle', 0.05); beep(1318, 0.3, 0.045, 'sine', 0.14);
  }
  paintHud();
  if(t >= TOP_T) startClear(nb);     /* いちばん大きい子が できたら クリア */
}

let bannerN = -1;

function flyStep(dt){
  const k = dt / 16.6667;
  const now = performance.now();
  const rise = now >= cheerT;

  if(!rise){
    /* ---- お祝い。まだ 飛ばずに、みんなで ぴょこぴょこ ---- */
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      const q = (now - (b.cheer || now)) / 460;
      const bounce = q > 0 ? Math.abs(Math.sin(q * Math.PI)) * Math.max(0, 1 - q * 0.10) : 0;
      b.y = (b.baseY === undefined ? (b.baseY = b.y) : b.baseY) - bounce * (b.big ? 16 : 9);
      b.rot = Math.sin(q * Math.PI * 2) * (b.big ? 0.05 : 0.09);
    }
    if(now - flying > cheerPop * 420){   /* きらきらと 紙ふぶきを 何回かに わけて */
      cheerPop++;
      puff(14, LINE_Y, H);
      if(cheerPop < 5) confetti(9);
      if(cheerPop % 2 === 0) beep(880 + cheerPop * 90, 0.22, 0.05, 'triangle');
    }
  } else {
    /* ---- 風船になって 空へ。ひとりずつ、ボーナスを かぞえながら ---- */
    if(!liftSet){
      liftSet = true;
      bonusSum = 0; liftI = 0;
      const arr = balls.slice().sort((a, b2) => a.y - b2.y);   /* うえの子から */
      arr.forEach((q, i) => { q.liftAt = cheerT + i * 190; });
      lastLift = cheerT + Math.max(0, balls.length - 1) * 190;
      showBonus(0);
    }
    for(let i = balls.length - 1; i >= 0; i--){
      const b = balls[i];
      if(!b.fly){
        if(now < (b.liftAt || 0)) continue;       /* じゅんばん待ち */
        b.fly = { v: 0.9 + Math.random() * 1.1, ph: Math.random() * 6.2832,
                  sw: 5 + Math.random() * 9 };
        const add = PTS[b.t] * 2;                 /* 空へ帰る ぶんの ボーナス */
        score += add; bonusSum += add;
        paintHud(); showBonus(bonusSum);
        sndBonus(liftI++);
      }
      b.fly.ph += 0.05 * k;
      b.y -= b.fly.v * 2.1 * k;
      b.x += Math.sin(b.fly.ph) * b.fly.sw * 0.02 * k;
      b.rot = Math.sin(b.fly.ph) * 0.09;
      if(b.y < -b.r - 40) balls.splice(i, 1);
    }
  }

  for(let i = sparks.length - 1; i >= 0; i--){
    const p2 = sparks[i];
    p2.x += p2.vx * k; p2.y += p2.vy * k; p2.vy += 0.015 * k;
    if(now - p2.t0 > 2600) sparks.splice(i, 1);
  }
  confStep(k);
  if(rise && (!balls.length || now - lastLift > 4200)){
    balls = []; sparks = []; confs = []; flying = 0; cheerT = 0;
    liftSet = false;
    showCong(false);
    showBonus(0, false);
    if(LIMIT === Infinity){
      showClear(clearBall);            /* ∞ は いったん ひと休み */
    } else {
      /* 3分のときは、からっぽの 板で そのまま つづき */
      if(!cur){ cur = newDrop(); next = next || newDrop(); }
      paintNext();
      dropAt = performance.now();
      if(!over){                       /* まだ 時間が あるよ、の ひとこと */
        showCong(true, 'KEEP IT UP!');
        congT = setTimeout(() => { showCong(false); congT = 0; }, 2200);
      }
    }
  }
}

/* ---- おとす ---- */
function drop(){
  if(over || paused || flying || !cur) return;
  const now = performance.now();
  if(now - dropAt < 320) return;
  dropAt = now;
  cur.x = Math.max(cur.r, Math.min(W - cur.r, aimX));
  cur.px = cur.x; cur.y = LINE_Y - 34; cur.py = cur.y - 1;
  balls.push(cur);
  cur = next; next = newDrop();
  cur.x = cur.px = aimX;
  sndDrop();
  paintNext();
}

/* ---- おしまいの見はり ---- */
let overT = 0, overL = 0;
function checkOver(now){
  if(over) return;
  let rest = false, any = false;
  for(let i = 0; i < balls.length; i++){
    const b = balls[i];
    if(!b.touch) continue;                       /* まだ 何にも あたっていない子は 見のがす */
    if(now - b.born < 900) continue;             /* 入れたばかりの子も 見のがす */
    if(b.y - b.r >= LINE_Y) continue;            /* 線より 下にいる */
    any = true;
    const v = Math.abs(b.y - b.py) + Math.abs(b.x - b.px);
    if(v < 1.5) rest = true;                     /* 線より うえで 止まっている */
  }
  /* 線より うえで おちついたら おしまい。
     ぶつかりあって ふるえたままの ときは、しばらく ようすを見る */
  if(!rest) overT = 0; else if(!overT) overT = now;
  if(!any) overL = 0; else if(!overL) overL = now;
  if(overT && now - overT > 1500) gameOver();
  else if(overL && now - overL > 5000) gameOver();
}
function timeOver(){
  if(over) return;
  endGame('FINISH', true);
}
function gameOver(){ endGame('いっぱいに なりました'); }
function endGame(title, bright){
  if(over) return;
  over = true;
  paused = false;
  if(bright) sndFinish(); else sndOver();
  document.getElementById('ovIc').innerHTML = '';
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('again').textContent = 'もういちど';
  let rec = false;
  if(LIMIT === 180000){
    rec = score > best;
    if(rec){ best = score; saveBest(); paintHud(); paintRank(); }
  } else {
    rec = saveEnd();                       /* ∞ も きろくに のこす */
  }
  document.getElementById('ovScore').textContent = score;
  document.getElementById('ovNew').style.display = rec && score > 0 ? '' : 'none';
  document.getElementById('over').classList.add('on');
}

function hx(c){ return [parseInt(c.substr(1,2),16), parseInt(c.substr(3,2),16), parseInt(c.substr(5,2),16)]; }
function mix(a, b, k){
  const x = hx(a), y = hx(b);
  return 'rgb(' + Math.round(x[0]+(y[0]-x[0])*k) + ',' + Math.round(x[1]+(y[1]-x[1])*k)
       + ',' + Math.round(x[2]+(y[2]-x[2])*k) + ')';
}
function skyAt(f){
  for(let i = 0; i < SKY.length - 1; i++){
    const a = SKY[i], b = SKY[i + 1];
    if(f <= b.at || i === SKY.length - 2){
      const k = Math.max(0, Math.min(1, (f - a.at) / (b.at - a.at)));
      return { top: mix(a.top, b.top, k), bot: mix(a.bot, b.bot, k),
               night: a.night + (b.night - a.night) * k };
    }
  }
  return { top: SKY[0].top, bot: SKY[0].bot, night: 0 };
}

  let q = ((Date.now() - NEW_MOON) % SYN) / SYN;
  return q < 0 ? q + 1 : q;

  if(!gibbous && !isNew) rx = Math.min(rx, R - 2.6);
  const so = waxing ? 1 : 0, si = gibbous ? so : 1 - so;

/* いまの 時刻を、空の すすみぐあいに うつす（∞ のとき）
   0 ＝ 昼の あおぞら、1 ＝ まよなか */
const CLOCK = [[0, 1], [4.5, 1], [6, 0.62], [7.5, 0.05], [15, 0.18],
               [16.5, 0.42], [18, 0.68], [19, 0.88], [20.5, 1], [24, 1]];
function clockF(){
  let h;
  if(typeof window.__hour === 'number') h = window.__hour;
  else { const d = new Date(); h = d.getHours() + d.getMinutes() / 60; }
  h = Math.max(0, Math.min(24, h));
  for(let i = 0; i < CLOCK.length - 1; i++){
    if(h <= CLOCK[i + 1][0]){
      const a = CLOCK[i], b = CLOCK[i + 1];
      const q = (h - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * q;
    }
  }
  return 1;
}
/* 空の すすみぐあい。∞ のときは、ほんとうの 時刻に あわせる */
function dayF(){
  /* START の 画面は いつも 今の 時間の 空。3分バトルは はじまってから 一日が すすむ */
  if(idle || LIMIT === Infinity) return clockF();
  return Math.min(1, tUsed / LIMIT);
}
function phaseKind(ph){
  if(ph === 2){
    /* 十五夜と クリスマスの 夜は フクロウは おやすみ */
    const sn = season();
    if(sn === 'tsukimi' || sn === 'xmas') return '';
    return 'owl';
  }
  return ph === 0 ? (Math.random() < 0.5 ? 'spar' : 'bird') : 'crow';
}
function kindPhase(k){ return k === 'crow' ? 1 : k === 'owl' ? 2 : 0; }
function perchY(o){ return LINE_Y - (o.kind === 'owl' ? 4.2 : 5.4 * o.sz); }

function spawnSky(now, ph){
  const kind = phaseKind(ph);
  if(!kind) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const sz = kind === 'owl' ? 1 : kind === 'crow' ? 1.12 : kind === 'spar' ? 0.88 : 1;
  const o = { kind: kind, sz: sz, face: dir,
              x: dir > 0 ? -28 : W + 28,
              y: 15 + Math.random() * 30,      /* 上のほうを 飛ぶ */
              v: dir * (kind === 'ufo' ? 0.28 : kind === 'hero' ? 0.92
                        : kind === 'owl' ? 0.42 : 0.52 + Math.random() * 0.36),
              ph: Math.random() * 6.2832, bob: 0.6 + Math.random() * 0.9,
              st: 'pass', t0: now, blink: Math.random() * 6.2832 };
  /* 鳥は よく 線に とまる */
  if(kind !== 'ufo' && kind !== 'hero' && Math.random() < 0.58){
    o.st = 'in';
    o.tx = 34 + Math.random() * (W - 68);
  }
  SKYL.push(o);
}

/* ---- UFO。30秒に 1回くらい やってきて、
        ひとり さらっていくか、ひとり 置いていく ---- */
function spawnUfo(now){
  const dir = Math.random() < 0.5 ? 1 : -1;
  SKYL.push({ kind: 'ufo', sz: 1, face: dir,
              x: dir > 0 ? -36 : W + 36,
              y: 46 + Math.random() * 13,
              v: dir * 0.52, ph: 0, bob: 0, blink: 0,
              st: 'in', t0: now, beam: 0,
              tx: 68 + Math.random() * (W - 136),
              job: Math.random() < LEVELS[curLv()].takeP ? 'take' : 'give' });
}
function ufoAct(o, now){
  if(o.job === 'take'){
    /* UFO の 近くで、いちばん 上のほうにいる子を ひとり */
    /* ひかりの すじの 下にいる子なら、大きい子でも さらわれる */
    let pick = null, bestS = 1e9;
    const near = [];
    for(let i = 0; i < balls.length; i++){
      const b = balls[i];
      if(b.fly) continue;
      if(Math.abs(b.x - o.x) < 58) near.push(b);
      const sc = Math.abs(b.x - o.x) + b.y * 0.08;
      if(sc < bestS){ bestS = sc; pick = b; }
    }
    if(near.length){
      /* むずかしいほど、大きい子が ねらわれる */
      const w = LEVELS[curLv()].grab;
      let tot = 0;
      const ws = near.map(q => { const v = Math.pow(2, q.t * w); tot += v; return v; });
      let r2 = Math.random() * tot;
      pick = near[near.length - 1];
      for(let i = 0; i < near.length; i++){ r2 -= ws[i]; if(r2 <= 0){ pick = near[i]; break; } }
    }
    if(pick){
      balls = balls.filter(q => q !== pick);
      LIFTS.push({ b: pick, t0: now, ux: o.x, uy: o.y });
      beep(320, 0.5, 0.05, 'sine');
      beep(720, 0.45, 0.04, 'triangle', 0.06);
    } else { o.job = 'give'; ufoAct(o, now); }
  } else {
    /* ひとり 置いていく。UFO の 子は いつも 虹色 */
    const t = Math.random() < .5 ? 0 : Math.random() < .7 ? 1 : 2;
    const nb = makeBall(t, o.x, o.y + 20, 'dog');
    nb.px = nb.x; nb.py = nb.y;
    nb.float = now + 5200;             /* ひかりに のって、のぼるのと おなじ ゆっくりさで */
    nb.rb = true;                      /* UFO の 子は みんな 虹色 */
    beep(784, 0.3, 0.05, 'triangle');
    beep(1046, 0.34, 0.05, 'sine', 0.09);
    beep(1318, 0.4, 0.05, 'sine', 0.19);
    balls.push(nb);
  }
}
function liftStep(k, now){
  for(let i = LIFTS.length - 1; i >= 0; i--){
    const L = LIFTS[i];
    L.b.y -= 1.15 * k;                 /* ゆっくり のぼる */
    L.b.x += (L.ux - L.b.x) * 0.035 * k;
    L.b.rot += 0.02 * k;
    if(L.b.y < L.uy + 2 || L.b.y < -40) LIFTS.splice(i, 1);
  }
}

function skyTick(dt, now, ph){
  const k = Math.min(3, dt / 16.6667);
  liftStep(k, now);
  /* じゃまの子 */
  const LV = LEVELS[curLv()];
  if(!LV.pest){ pestNext = 0; }
  else if(!pestNext){ pestNext = now + LV.pest * 0.7 + Math.random() * LV.pestR; }
  else if(now > pestNext){
    pestNext = now + LV.pest + Math.random() * LV.pestR;
    if(!over && !idle && !flying && !paused) dropPest(now);
  }

  /* 空をとぶ人は 3分に1回くらい */
  if(!heroNext) heroNext = now + 60000 + Math.random() * 90000;
  else if(now > heroNext){
    heroNext = now + 150000 + Math.random() * 70000;
    const dir = Math.random() < 0.5 ? 1 : -1;
    SKYL.push({ kind: 'hero', sz: 1, face: dir,
                x: dir > 0 ? -34 : W + 34,
                y: 24 + Math.random() * (LINE_Y - 56),
                v: dir * 0.92, ph: Math.random() * 6.2832, bob: 0.8,
                st: 'pass', t0: now, blink: 0 });
  }
  if(!ufoNext) ufoNext = now + 12000 + Math.random() * 9000;
  else if(now > ufoNext && !over && !idle){   /* START の 画面では 来ない */
    const L = LEVELS[curLv()];
    ufoNext = now + L.gap + Math.random() * L.gapR;
    spawnUfo(now);
    /* むずかしいほど、2機で やってくることが ある */
    if(Math.random() < L.duo){
      const o2 = SKYL[SKYL.length - 1];
      spawnUfo(now);
      const o3 = SKYL[SKYL.length - 1];
      o3.face = -o2.face; o3.v = -Math.abs(o3.v) * o2.face;
      o3.x = o3.face > 0 ? -36 - 40 : W + 36 + 40;
      o3.y = o2.y + (o2.y > 42 ? -14 : 14);
      o3.tx = o2.tx > W / 2 ? 60 + Math.random() * 60 : W - 120 + Math.random() * 60;
      o3.job = o2.job === 'take' ? 'give' : 'take';
    }
  }
  if(ph !== skyPh){                     /* 時間が うつると、そっと 入れかわる */
    skyPh = ph;
    for(let i = 0; i < SKYL.length; i++){
      const o = SKYL[i];
      if(o.kind === 'ufo' || o.kind === 'hero') continue;
      if(kindPhase(o.kind) !== ph && o.st === 'perch'){
        o.until = Math.min(o.until, now + 900 + Math.random() * 1600);
      }
    }
  }
  if(now > skyNext){
    skyNext = now + 3200 + Math.random() * 6000;
    /* 鳥・カラス・フクロウは いちどに 一羽だけ */
    const alone = !SKYL.some(o => o.kind !== 'ufo' && o.kind !== 'hero');
    if(alone) spawnSky(now, ph);
  }
  for(let i = SKYL.length - 1; i >= 0; i--){
    const o = SKYL[i];
    o.ph += (o.st === 'perch' ? 0.025 : (o.kind === 'owl' ? 0.13 : 0.2)) * k;
    o.blink += 0.06 * k;
    if(o.kind === 'ufo'){
      if(o.st === 'in'){
        o.x += o.v * k;
        if((o.v > 0 && o.x >= o.tx) || (o.v < 0 && o.x <= o.tx)){
          o.st = 'beam'; o.t0 = now; ufoAct(o, now);
        }
      } else if(o.st === 'beam'){
        o.x += o.v * 0.04 * k;
        o.y += Math.sin(now / 520) * 0.05 * k;
        /* さらう子が のぼりきるまでは、ゆっくり 待つ */
        const span = LIFTS.length ? 7800 : (o.job === 'give' ? 6400 : 3400);
        const q = (now - o.t0) / span;
        o.beam = q < 0.12 ? q / 0.12 : q > 0.88 ? Math.max(0, (1 - q) / 0.12) : 1;
        if(q >= 1 || (o.job === 'take' && !LIFTS.length && now - o.t0 > 2600)){
          o.st = 'out'; o.beam = 0;
        }
      } else {
        o.x += o.v * k;
        o.y -= 0.06 * k;
      }
      if(o.x < -60 || o.x > W + 60) SKYL.splice(i, 1);
      continue;
    }
    if(o.st === 'perch'){
      if(now > o.until){
        o.st = 'off';
        o.face = Math.random() < 0.5 ? -1 : 1;
        o.v = o.face * (0.55 + Math.random() * 0.45);
        o.t0 = now;
      }
    } else if(o.st === 'in'){
      o.x += o.v * k;
      if(o.kind !== 'hero') o.y += Math.sin(o.ph * 0.5) * 0.15 * o.bob * k;
      if((o.v > 0 && o.x >= o.tx) || (o.v < 0 && o.x <= o.tx)){
        o.st = 'land'; o.t0 = now; o.x0 = o.x; o.y0 = o.y;
        o.x1 = o.x + o.v * 15;
      }
    } else if(o.st === 'land'){
      const q = Math.min(1, (now - o.t0) / 720);
      const e = q * q * (3 - 2 * q);
      o.x = o.x0 + (o.x1 - o.x0) * e;
      o.y = o.y0 + (perchY(o) - o.y0) * e;
      if(q >= 1){ o.st = 'perch'; o.until = now + 3600 + Math.random() * 7400; }
    } else {
      o.x += o.v * k;
      if(o.kind !== 'hero'){          /* 空をとぶ人は まっすぐ 水平に */
        o.y += (o.st === 'off' ? -0.24 : Math.sin(o.ph * 0.5) * 0.15 * o.bob) * k;
      }
    }
    if(o.x < -54 || o.x > W + 54 || o.y < -46) SKYL.splice(i, 1);
  }
}

/* ---- お日さま と お月さま ---- */
function drawSunMoon(now, f, night){
  const fs = Math.min(1, f / 0.88);
  const sa = Math.max(0, Math.min(1, 1 - (night - 0.02) * 2.6));
  if(sa > 0.012){
    const warm = fs < 0.42 ? 0 : Math.min(1, (fs - 0.42) / 0.48);
    /* 上を 北に して、東（右）から 南（下）を まわって 西（左）へ */
    const x = W * (0.86 - 0.72 * fs);
    const y = 26 + 48 * Math.sin(Math.PI * Math.max(0, Math.min(1, fs)));
    /* One Step の HOME の お日さまと おなじ 色 */
    const c0 = mix('#FFFBEC', '#EC8B6D', warm);
    const c1 = mix('#FDEBB4', '#E4805F', warm);
    const c2 = mix('#F6CE72', '#E1785C', warm);
    const c3 = mix('#EFB94C', '#DA7055', warm);
    const glow = mix('#F6CE72', '#E1785C', warm);
    const r = (12 + warm * 1.4) * (1 + 0.02 * Math.sin(now / 3000));
    const rgba = (c, a) => c.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
    ctx.save();
    ctx.globalAlpha = sa;
    /* まわりの ひかり */
    const go = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * (warm ? 3.0 : 3.6));
    go.addColorStop(0, rgba(glow, 0.30));
    go.addColorStop(0.45, rgba(glow, 0.15));
    go.addColorStop(1, rgba(glow, 0));
    ctx.fillStyle = go;
    ctx.beginPath(); ctx.arc(x, y, r * 3.6, 0, 6.2832); ctx.fill();
    /* ふちの わ */
    ctx.strokeStyle = rgba(glow, 0.24); ctx.lineWidth = r * 0.46;
    ctx.beginPath(); ctx.arc(x, y, r * 1.22, 0, 6.2832); ctx.stroke();
    /* まんなかは 白く、そとに いくほど こく */
    const gs = ctx.createRadialGradient(x, y - r * 0.12, r * 0.06, x, y, r);
    gs.addColorStop(0, c0); gs.addColorStop(0.34, c1);
    gs.addColorStop(0.66, c2); gs.addColorStop(1, c3);
    ctx.fillStyle = gs;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  const ma = Math.max(0, Math.min(1, (night - 0.10) * 2.0));
  if(ma > 0.012){
    const x = W * 0.75, y = 40, r = 12.5;
    ctx.save();
    ctx.globalAlpha = ma;
    const gr = ctx.createRadialGradient(x, y, r * 0.7, x, y, r * 2.6);
    gr.addColorStop(0, 'rgba(255,248,226,.30)');
    gr.addColorStop(1, 'rgba(255,248,226,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 6.2832); ctx.fill();
    /* みかづき */
    const mim = skyArt('moon' + Math.floor(moonPhase() * 60), moonSvgArt());
    if(mim) ctx.drawImage(mim, x - 15, y - 15, 30, 30);
    ctx.restore();
  }
}

/* ---- 空の子を 描く ---- */
function drawSkyOne(o, now){
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(o.sz * (o.face < 0 ? -1 : 1), o.sz);
  const perch = o.st === 'perch';
  const flap = perch ? -0.18 : Math.sin(o.ph) * 0.95;

  if(o.kind === 'ufo'){
    ctx.scale(o.face < 0 ? -1 : 1, 1);          /* UFO は 向きなし */
    if(o.beam > 0.01){                      /* ひかりの すじ */
      const len = H - o.y;
      const gb = ctx.createLinearGradient(0, 2, 0, len);
      gb.addColorStop(0, 'rgba(250,240,186,' + (0.62 * o.beam).toFixed(3) + ')');
      gb.addColorStop(0.55, 'rgba(250,236,170,' + (0.30 * o.beam).toFixed(3) + ')');
      gb.addColorStop(1, 'rgba(250,236,170,0)');
      ctx.fillStyle = gb;
      ctx.beginPath(); ctx.moveTo(-5.5, 2); ctx.lineTo(5.5, 2);
      ctx.lineTo(15 + len * 0.06, len); ctx.lineTo(-15 - len * 0.06, len);
      ctx.closePath(); ctx.fill();
    }
    const uw = 44, uh = uw * 28 / 48, us = uw / 48;
    const uimg = skyArt('ufo', UFO_SVG);
    /* ふわふわ 揺れる（One Step と おなじ うごき） */
    ctx.rotate(Math.sin(now / 1700) * 0.044);
    ctx.translate(0, Math.sin(now / 1700 + 1) * 1.6);
    if(uimg) ctx.drawImage(uimg, -uw / 2, -uh / 2 - 2, uw, uh);
    const xmas = season() === 'xmas';
    if(xmas){                                  /* まるい ところが 赤と緑に */
      const q = 0.5 + 0.5 * Math.sin(now / 520);
      ctx.save();
      ctx.globalAlpha = 0.34 + 0.3 * q;
      ctx.fillStyle = '#D6453F';
      ctx.beginPath();
      ctx.ellipse(0, (10.6 - 14) * us - 2, 9.2 * us, 7.2 * us, 0, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.34 + 0.3 * (1 - q);
      ctx.fillStyle = '#2F8A55';
      ctx.beginPath();
      ctx.ellipse(0, (10.6 - 14) * us - 2, 9.2 * us, 7.2 * us, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    for(let i = 0; i < UFO_LAMP.length; i++){
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now / 200 - i * 1.1));
      ctx.globalAlpha = a;
      ctx.fillStyle = xmas ? (i % 2 ? '#3FA86A' : '#E2483F') : '#F2DC85';
      ctx.beginPath();
      ctx.arc((UFO_LAMP[i][0] - 24) * us, (UFO_LAMP[i][1] - 14) * us - 2, 1.5 * us, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore(); return;
  }

  if(o.kind === 'hero'){
    const hw = 46, hh = hw * 30 / 64;
    const himg = skyArt('hero', HERO_SVG);
    if(himg) ctx.drawImage(himg, -hw / 2, -hh / 2, hw, hh);
    if(season() === 'xmas'){                  /* サンタの ぼうし */
      const hs = hw / 64;
      ctx.save(); ctx.translate((44 - 32) * hs, (12.8 - 15) * hs);
      hatDraw(4.3 * hs, true); ctx.restore();
    }
    ctx.restore(); return;
  }

  if(o.kind === 'owl'){
    /* One Step の フクロウ。とまるときは 正面、飛ぶときは 横向き */
    const ow = 30, oh = 30;
    if(perch){
      const im = skyArt('owlSit', OWL_SIT_SVG);
      ctx.scale(o.face < 0 ? -1 : 1, 1);          /* 正面なので 向きは なし */
      if(im) ctx.drawImage(im, -ow / 2, -oh / 2 - 3.4, ow, oh);
    } else {
      const im = skyArt('owlFly', OWL_FLY_SVG);
      /* はばたきは、ゆっくり 上下に のびちぢみ */
      ctx.scale(1, 1 + Math.sin(o.ph) * 0.085);
      if(im) ctx.drawImage(im, -ow / 2, -oh / 2, ow, oh);
    }
    ctx.restore(); return;
  }

  /* 小鳥・スズメ・カラス */
  const crow = o.kind === 'crow', spar = o.kind === 'spar';
  const body = crow ? '#3C3C46' : spar ? '#B08A5E' : '#8FB4CE';
  const wing = crow ? '#2A2A33' : spar ? '#8A6A46' : '#6C93B2';
  const beak = crow ? '#5C5C66' : spar ? '#6B5A46' : '#E7A85C';
  ctx.fillStyle = body;
  ctx.beginPath();                                /* しっぽ */
  ctx.moveTo(-3.4, -0.4);
  ctx.lineTo(perch ? -8.2 : -9.4, perch ? -3.4 : -2.6);
  ctx.lineTo(-7.8, 1.6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 5.2, 3.6, perch ? -0.16 : 0.06, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(4.2, -2.5, 2.9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = beak;
  ctx.beginPath(); ctx.moveTo(6.6, -2.7); ctx.lineTo(9.6, -1.9); ctx.lineTo(6.6, -1.1);
  ctx.closePath(); ctx.fill();
  if(spar){                                     /* スズメの ほお */
    ctx.fillStyle = '#F4EFE3';
    ctx.beginPath(); ctx.ellipse(4.5, -2.0, 1.5, 1.2, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#4A3B2C';
    ctx.beginPath(); ctx.ellipse(4.6, -1.7, 0.72, 0.6, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#5C4632';                  /* あたまの てっぺん */
    ctx.beginPath(); ctx.arc(4.2, -3.6, 2.2, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
  }
  ctx.fillStyle = crow ? '#E8E2D4' : '#3A3A44';
  ctx.beginPath(); ctx.arc(5.1, -3.1, 0.62, 0, 6.2832); ctx.fill();
  ctx.save(); ctx.translate(0.4, -0.9); ctx.rotate(flap);
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.ellipse(-1.2, 0, 4.4, 1.9, 0.1, 0, 6.2832); ctx.fill();
  ctx.restore();
  if(perch){
    ctx.strokeStyle = crow ? '#5C5C66' : spar ? '#9B7B4F' : '#C9903F';
    ctx.lineWidth = 0.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-0.9, 3.2); ctx.lineTo(-0.9, 5.3);
    ctx.moveTo(1.3, 3.2); ctx.lineTo(1.3, 5.3); ctx.stroke();
  }
  ctx.restore();
}


/* One Step の 犬（よこ向き）。START の 画面で、赤い線の うえを かけぬける */
function runnerSvg(a, pose, coat){
  /* a: あしの ふりの 角度（-20〜20 ど）。pose: ''｜sit｜lie｜sleep
     すわる・ふせる・ねむるの かたちは One Step の 犬と おなじ */
  const sit = pose === 'sit', lie = pose === 'lie' || pose === 'sleep';
  const sleep = pose === 'sleep';
  const A = (sit || lie) ? 0 : a, B = (sit || lie) ? 0 : -a;
  /* 毛色。子犬は 黒か 茶色（One Step と おなじ 色） */
  const C = coat === 'black' ? ['#4C4239', '#332C25', '#7A6E62']
          : coat === 'brown' ? ['#8A6C4F', '#6E5339', '#C7AC87']
          : ['#C9A87C', '#A6845C', '#EBDCC4'];
  const body = C[0], dark = C[1], light = C[2], nose = '#3A2F26';
  /* うしろあし（おしり側）と まえあし */
  const fold = 'transform="translate(0,2) rotate(-72 ';
  const flat = 'transform="translate(0,19.6) scale(1,0.34) translate(0,-19.6)"';
  const la = sit ? (fold + '13 19.6)"') : lie ? flat
           : 'transform="rotate(' + A + ' 12.5 20)"';
  const lb = sit ? (fold + '10 19.6)"') : lie ? flat
           : 'transform="rotate(' + B + ' 12.5 20)"';
  const lf = sit ? '' : lie ? flat : 'transform="rotate(' + A + ' 21.5 20)"';
  const lg = sit ? '' : lie ? flat : 'transform="rotate(' + B + ' 21.5 20)"';
  const laFill = sit ? dark : body;          /* たたんだ あしは こい色で */
  const hd = sleep ? ' transform="translate(0,3.4)"' : '';
  const wrap = sit ? '<g transform="rotate(-20 24 26)">'
             : lie ? '<g transform="translate(0,6.5)">' : '<g>';
  /* 画のこまかさは 3ばい（スマホの こうかいぞうどでも くっきり） */
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 30" width="102" height="90">'
    + '<defs><clipPath id="rHead"><circle cx="26" cy="12.5" r="5.4"/></clipPath>'

const RUNA = [-20, -15, -10, -5, 0, 5, 10, 15, 20];   /* あしの 角度 9まい */
let runner = null, runNext = 0, runWarm = false;
const RPOSE = ['sit', 'lie', 'sleep'];
function warmRunner(){                 /* 出るまえに ぜんぶ よみこんでおく */
  if(runWarm) return;
  runWarm = true;
  ['', 'black', 'brown'].forEach(function(c){
    RUNA.forEach(function(a){ skyArt('run' + c + a, runnerSvg(a, '', c)); });
    RPOSE.forEach(function(q){ skyArt('pose' + c + q, runnerSvg(0, q, c)); });
  });
}
/* 時間で かわる ようす。朝と昼は 元気に、夕方と夜は のんびり */
function pickPose(){
  const ph = phaseOf(dayF()), r = Math.random();
  if(ph === 0) return r < 0.88 ? '' : r < 0.95 ? 'sit' : 'lie';
  if(ph === 1) return r < 0.40 ? '' : r < 0.72 ? 'sit' : 'lie';
  return r < 0.20 ? '' : r < 0.40 ? 'sit' : r < 0.64 ? 'lie' : 'sleep';
}
function runTick(dt, now){
  if(idle){
    warmRunner();
    if(!runNext) runNext = now + 1800 + Math.random() * 3000;
    else if(!runner && now > runNext){
      const dir = Math.random() < 0.5 ? 1 : -1;
      const ph0 = phaseOf(dayF());
      /* 朝と昼は 走る子が おおい */
      const gait = Math.random() < (ph0 === 0 ? 0.42 : 0.72) ? 0 : 1;
      const V  = [0.55, 1.45][gait];
      const FP = [0.155, 0.30][gait];
      const word = seasonWord();
      const pose = pickPose();
      runner = { x: dir > 0 ? -26 : W + 26, dir: dir, gait: gait,
                 v0: dir * (V * (0.9 + Math.random() * 0.2)), fp: FP, ph: 0,
                 say: (word && Math.random() < 0.5) ? word : '',
                 pose: pose, st: 'walk',
                 stopX: 52 + Math.random() * (W - 104), rest: 0,
                 pups: Math.random() < 0.2 ? (Math.random() < 0.7 ? 1 : 2) : 0,
                 coat: ['', ''] };        /* 子犬も 親と おなじ 毛色 */
      runner.v = runner.v0;
      runNext = now + 6000 + Math.random() * 8000;
    }
  } else { runner = null; }
  if(runner){
    const k = Math.min(3, dt / 16.6667);
    const o = runner;
    if(o.st === 'walk' && o.pose &&
       (o.dir > 0 ? o.x >= o.stopX : o.x <= o.stopX)){
      o.st = 'rest'; o.v = 0;            /* すこし 休む */
      o.rest = now + 4500 + Math.random() * 7000;
      if(o.pose === 'sleep') o.rest += 4000;
    }
    if(o.st === 'rest' && now > o.rest){ o.st = 'go'; o.v = o.v0; }
    o.x += o.v * k;
    if(o.v) o.ph += o.fp * k;
    if(o.x < -40 || o.x > W + 40) runner = null;
  }
}
/* ================== 季節の かざり ================== */
/* 新月の ときこく（Meeus のしき。中秋の名月を さがすため） */
function newMoonMs(k){
  const RAD = Math.PI / 180;
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T;
  let jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T2 - 0.000000150 * T3;
  const E  = 1 - 0.002516 * T - 0.0000074 * T2;
  const M  = (2.5534 + 29.10535670 * k - 0.0000014 * T2) * RAD;
  const M1 = (201.5643 + 385.81693528 * k + 0.0107582 * T2) * RAD;
  const F  = (160.7108 + 390.67050284 * k - 0.0016118 * T2) * RAD;
  const O  = (124.7746 - 1.56375588 * k + 0.0020672 * T2) * RAD;
  jde += -0.40720 * Math.sin(M1) + 0.17241 * E * Math.sin(M) + 0.01608 * Math.sin(2 * M1)
       + 0.01039 * Math.sin(2 * F) + 0.00739 * E * Math.sin(M1 - M)
       - 0.00514 * E * Math.sin(M1 + M) + 0.00208 * E * E * Math.sin(2 * M)
       - 0.00111 * Math.sin(M1 - 2 * F) - 0.00057 * Math.sin(M1 + 2 * F)
       + 0.00056 * E * Math.sin(2 * M1 + M) - 0.00042 * Math.sin(3 * M1)
       + 0.00042 * E * Math.sin(M + 2 * F) + 0.00038 * E * Math.sin(M - 2 * F)
       - 0.00024 * E * Math.sin(2 * M1 - M) - 0.00017 * Math.sin(O)
       - 0.00007 * Math.sin(M1 + 2 * M);
  return (jde - 2440587.5) * 86400000;
}
/* 中秋の名月＝旧暦 8月15日。9/8〜10/7 に くる 新月＋14日 */
const harvCache = {};
function harvestMD(year){
  if(harvCache[year]) return harvCache[year];
  let out = null;
  const k0 = Math.round((year - 2000) * 12.3685) + 6;
  for(let k = k0; k < k0 + 6 && !out; k++){
    /* 旧暦は 日本の こよみで かぞえる（＋9時間） */
    const nm = new Date(newMoonMs(k) + 9 * 3600000);
    const day1 = Date.UTC(nm.getUTCFullYear(), nm.getUTCMonth(), nm.getUTCDate());
    const d15 = new Date(day1 + 14 * 86400000);
    const m = d15.getUTCMonth() + 1, dd = d15.getUTCDate();
    if(d15.getUTCFullYear() === year && ((m === 9 && dd >= 8) || (m === 10 && dd <= 7))){
      out = [m, dd];
    }
  }
  harvCache[year] = out || [0, 0];
  return harvCache[year];
}
let seasonAt = 0, seasonV = '';
function season(){
  const t = Date.now();
  if(t - seasonAt < 60000 && seasonAt) return seasonV;
  seasonAt = t;
  const d = new Date(t), m = d.getMonth() + 1, day = d.getDate();
  if(m === 12 && day <= 25) seasonV = 'xmas';          /* 12/1〜25の夜まで */
  else if(m === 1 && day <= 7) seasonV = 'newyear';    /* 松の内 */
  else {
    const h = harvestMD(d.getFullYear());
    seasonV = (h[0] === m && h[1] === day) ? 'tsukimi' : '';
  }
  return seasonV;
}
function tsukimiDay(){ return season() === 'tsukimi'; }

  ctx.beginPath();                        /* ふわっと まるく、すこしだけ 山形に */
  ctx.moveTo(20.4, 9.0);

  ctx.bezierCurveTo(22.3, 5.4, 19.2, 6.7, 20.4, 9.0);

function drawTree(now){

              mix('#568759', '#79B685', nt)];
  for(let i = 0; i < 3; i++){
    const base = by - 6 - i * 10.5, hw = 20 - i * 4.6, hg = 15.5;
    ctx.fillStyle = GR[i];
    ctx.beginPath();
    ctx.moveTo(bx, base - hg);
    ctx.lineTo(bx - hw, base);
    ctx.quadraticCurveTo(bx, base + 2.2, bx + hw, base);
    ctx.closePath(); ctx.fill();
  }
  const topY = by - 6 - 2 * 10.5 - 15.5;
  /* ぴかぴか する かざり */
  const LG = [[-11, -13, '#E8C86A'], [10, -15, '#C4514A'], [-6, -24, '#7FA6C4'],
              [8, -27, '#E8C86A'], [-3, -35, '#C4514A'], [5, -38, '#9CC08A'],
              [-13, -10, '#9CC08A'], [13, -11, '#7FA6C4']];
  for(let i = 0; i < LG.length; i++){
    const a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now / 380 + i * 1.7));
    ctx.globalAlpha = a;
    ctx.fillStyle = LG[i][2];
    ctx.beginPath(); ctx.arc(bx + LG[i][0], by + LG[i][1], 1.7, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* てっぺんの ☆ */
  const tw = 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(now / 300));
  ctx.save();
  ctx.translate(bx, topY - 3.4);
  const gg = ctx.createRadialGradient(0, 0, 1, 0, 0, 11);
  gg.addColorStop(0, 'rgba(255,236,168,' + (0.55 * tw).toFixed(2) + ')');
  gg.addColorStop(1, 'rgba(255,236,168,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#F4CD62';
  ctx.globalAlpha = 0.75 + 0.25 * tw;
  ctx.beginPath();
  for(let i = 0; i < 10; i++){
    const rr = i % 2 ? 2.3 : 5.6, an = -Math.PI / 2 + i * Math.PI / 5;
    const fx = Math.cos(an) * rr, fy = Math.sin(an) * rr;
    if(i === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function starStep(dt, now){

    starNext = now + 75000 + Math.random() * 60000;
    starAdd();
    if(Math.random() < 0.3) setTimeout(starAdd, 800 + Math.random() * 700);
  }
  for(let i = stars2.length - 1; i >= 0; i--){

    const a = q < 0.12 ? q / 0.12 : q > 0.7 ? Math.max(0, (1 - q) / 0.3) : 1;
    const sc = 0.5 + q * 0.5;

    const an = Math.atan2(o.dy, o.dx * o.dir) * o.dir;

    for(let i = 0; i < fw.length; i++){
      const o = fw[i], t = o.t;
      ctx.save();
      if(t < 850){                       /* のぼる ひとすじ（One Step の fw-rise） */
        const q = t / 850, e = 1 - Math.pow(1 - q, 2.2);
        const yy = o.y + o.climb * (1 - e), xx = o.x + o.sway * (1 - e);
        const hgt = 20 * (0.35 + e * 0.65);
        const g = ctx.createLinearGradient(xx, yy, xx, yy + hgt);
        g.addColorStop(0, 'rgba(242,220,168,' + (q < 0.18 ? q * 4.7 : 0.82).toFixed(2) + ')');
        g.addColorStop(1, 'rgba(238,214,164,0)');

        ctx.shadowColor = 'rgba(240,208,138,.6)'; ctx.shadowBlur = 4;
        ctx.beginPath(); ctx.rect(xx - 0.75, yy, 1.5, hgt); ctx.fill();
        ctx.shadowBlur = 0;
      } else {                           /* ぱっと ひらく */
        const q = Math.min(1, (t - 850) / 1500);
        const e = 1 - Math.pow(1 - q, 3);
        /* まんなかの ひかり */
        if(q < 0.45){
          const cq = q / 0.45;
          const csc = cq < 0.2 ? 0.3 + cq * 3.5 : 1 - (cq - 0.2) * 0.75;
          ctx.globalAlpha = 0.7 * (1 - cq);

          ctx.beginPath(); ctx.arc(o.x, o.y, 2 * csc, 0, 6.2832); ctx.fill();
          ctx.shadowBlur = 0;
        }

          const an = (6.2832 / o.rays) * j - Math.PI / 2;
          const len = (j % 2 ? o.reach * 0.66 : o.reach) * (e * 1.06);

          ctx.lineTo(o.x + Math.cos(an) * len, o.y + Math.sin(an) * len + dp);
          ctx.stroke();

          ctx.shadowColor = col; ctx.shadowBlur = 3;

  for(let i = 0; i < wx.length; i++){
    const o = wx[i];
    ctx.save();
    ctx.translate(o.x, o.y);
    if(kind === 'snow'){
      /* まわりが ふわっと ぼけた 雪（One Step の 庭の 雪と おなじ かんじ） */
      const R = o.r * 1.5;

      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(0.55, 'rgba(255,255,255,.88)');
      g.addColorStop(0.78, 'rgba(255,255,255,.42)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fill();
    } else if(kind === 'sakura'){
      ctx.rotate(o.rot);
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = SAKURA_C[o.ci];
      ctx.beginPath();
      ctx.moveTo(0, -o.r);

      ctx.quadraticCurveTo(0, o.r * 0.55, -o.r * 0.34, o.r * 0.9);
      ctx.quadraticCurveTo(-o.r * 0.9, -o.r * 0.3, 0, -o.r);

  if(day && now > bfNext && bfs.length < 2){
    bfNext = now + 18000 + Math.random() * 26000;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const r = Math.random();

               c: r < 0.04 ? 'white' : r < 0.15 ? 'blue' : 'yellow' });
  }

  if(!idle || cntT){
    if(rolls.length) rolls.length = 0;
    rollNext = 0;
    return;
  }
  const k = Math.min(3, dt / 16.6667);
  if(!rollNext){ rollNext = now + 3500 + Math.random() * 4000; return; }
  if(!rolls.length && now > rollNext){
    const dir = Math.random() < 0.5 ? 1 : -1;
    const king = Math.random() < 0.28;          /* たまに 王さまが 先頭で */
    const n = 1 + Math.floor(Math.random() * 2);
    const v = dir * (0.75 + Math.random() * 0.75);
    let gap = 14;
    for(let i = 0; i < n + (king ? 1 : 0); i++){
      const kg = king && i === 0;
      const r = kg ? 30 + Math.random() * 9 : 11 + Math.random() * 11;
      gap += r;
      rolls.push({ r: r, ci: kg ? 0 : 1 + Math.floor(Math.random() * 3),
                   x: dir > 0 ? -gap : W + gap, y: 0,
                   v: v * (1 - i * 0.02), rot: Math.random() * 6.2832, crown: kg });
      gap += r + 5;
    }
    rollNext = now + 20000 + Math.random() * 16000;
  }
  for(let i = rolls.length - 1; i >= 0; i--){
    const o = rolls[i];
    o.x += o.v * k;
    o.rot += (o.v * k) / o.r;                    /* ころがる むき */
    o.y = LINE_Y - o.r + 0.8;
    /* 出ていった むこう側で だけ 消す */
    if(o.v > 0 ? o.x > W + o.r + 40 : o.x < -o.r - 40) rolls.splice(i, 1);

function drawDog(x, ph, rest, dir, sc, gait, coat){
  const c = coat || '';

  if(rest){
    img = skyArt('pose' + c + rest, runnerSvg(0, rest, c));
  } else {
    const sw = Math.sin(ph * Math.PI / 2);
    const a = Math.round(sw * 4) * 5;
    img = skyArt('run' + c + a, runnerSvg(a, '', c));
  }
  if(!img) return null;
  const h = 30 * sc, w = 34 * sc;
  const bob = rest ? 0 : [0.5, 0.9][gait || 0] * sc;
  const dy = rest === 'lie' || rest === 'sleep' ? -2.4 * sc : 0;
  ctx.save();
  ctx.translate(x, LINE_Y - h + 4.6 * sc + dy + Math.sin(ph * Math.PI) * bob);
  if(dir < 0){ ctx.translate(w / 2, 0); ctx.scale(-1, 1); ctx.translate(-w / 2, 0); }
  ctx.drawImage(img, -w / 2, 0, w, h);
  if(season() === 'xmas'){               /* サンタの ぼうし（どの かっこうでも） */
    /* あたまの 場所は かっこうで かわる */
    const HP = rest === 'sit' ? [4.3, 12.6, -0.349]
             : rest === 'lie' ? [9, 19.0, 0]
             : rest === 'sleep' ? [9, 22.4, 0]
             : [9, 12.5, 0];
    ctx.save();
    ctx.translate(HP[0] * sc, HP[1] * sc);
    if(HP[2]) ctx.rotate(HP[2]);

    const back = 40 + (i - 1) * 25;
    drawDog(o.x - o.dir * back, o.ph + i * 1.3, rest ? (rest === 'sleep' ? 'lie' : rest) : '',

function draw(now){
  const sc = cv.width / W;

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* 夜が ちかづくと 星 */
  if(sky.night > 0.02){
    ctx.save();
    for(let i = 0; i < STARS.length; i++){
      const st2 = STARS[i];

      ctx.globalAlpha = sky.night * tw * 0.9;
      ctx.fillStyle = '#FFF8E6';

  /* UFO に のぼっていく子 */
  for(let i = 0; i < LIFTS.length; i++){
    const L = LIFTS[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, (L.b.y - L.uy) / 46));
    drawBall(L.b, now);

  }

  for(let i = 0; i < SKYL.length; i++) drawSkyOne(SKYL[i], now);

  if(!over && !idle && cur){

  for(let i = 0; i < sparks.length; i++){
    const p2 = sparks[i];
    const q = (now - p2.t0) / 2600;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - q) * .9;
    ctx.fillStyle = RB[p2.c];
    ctx.beginPath(); ctx.arc(p2.x, p2.y, 2.6, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* 紙ふぶき */
  for(let i = 0; i < confs.length; i++){
    const c = confs[i];
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    /* ひらひら。横向きになった ときは 細く見える */
    const sx = Math.max(0.16, Math.abs(Math.cos(c.ph)));
    ctx.scale(sx, 1);
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.c;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }

  /* くっついた ところの 光 */
  for(let i = pops.length - 1; i >= 0; i--){
    const p = pops[i];
    const k = (now - p.t0) / 480;
    if(k >= 1){ pops.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = (1 - k) * .55;
    const ph2 = (now * 0.12) % 360;
    ctx.strokeStyle = p.rb ? 'hsl(' + ph2 + ',92%,58%)'
      : p.chain ? '#3F9E6B' : p.bow ? '#A02C3C' : p.same ? '#7FA6C4' : '#C9A87C';
    ctx.lineWidth = 2.4 * (1 - k) + .6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k * .5), 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = (1 - k) * .9;
    ctx.fillStyle = p.rb ? 'hsl(' + ph2 + ',88%,46%)'
      : p.chain ? '#2F8256' : p.bow ? '#A02C3C' : p.same ? '#5D7E96' : '#8B7C6B';
    ctx.font = '700 12px "Space Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+' + p.gain, p.x, p.y - p.r - 6 - k * 14);
    ctx.restore();
  }
}

function drawBall(b, now){
  const img = spriteFor(b);
  const k = b.r / SVG_R;                 /* 絵の 半径 28 を その子の 半径に */
  const w = SVG_W * k, h = SVG_H * k;
  let pop = 1;
  if(now && b.born && now - b.born < 260){
    const q = (now - b.born) / 260;
    pop = 1 + Math.sin(q * Math.PI) * 0.12;
  }
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot || 0);
  ctx.scale(pop, pop);
  if(img){
    if(b.rb && now){
      /* 虹の子は、絵そのものを 虹の色に。耳も ふくめて まるごと */
      const need = w * (cv.width / W);   /* じっさいの 点の かず */
      /* クリスマスの ころは 赤と緑に ひかる */
      const hue = season() === 'xmas'
        ? 2 + 130 * (0.5 - 0.5 * Math.cos(now / 1150))   /* 赤と緑を ゆっくり 行き来 */
        : (now * 0.042) % 360;
      ctx.drawImage(rbArt(img, hue, need), -SVG_CX * k, -SVG_CY * k, w, h);
    } else {
      ctx.drawImage(img, -SVG_CX * k, -SVG_CY * k, w, h);
    }
  } else {
    ctx.fillStyle = '#E4D8C4';
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
  }
  /* 空へ帰るときは、ひもの ついた 風船になる */
  if(b.fly){
    ctx.save();
    ctx.strokeStyle = 'rgba(120,104,86,.5)';
    ctx.lineWidth = Math.max(0.3, b.r * 0.018);      /* ひもは 細く */
    ctx.beginPath();
    ctx.moveTo(0, b.r * 0.92);
    ctx.quadraticCurveTo(b.r * 0.3, b.r * 1.5, -b.r * 0.12, b.r * 2.1);
    ctx.stroke();
    ctx.globalAlpha = .42;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-b.r * 0.42, -b.r * 0.2, b.r * 0.12, b.r * 0.26, -0.35, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  /* いちばん大きい子は、ずっと 内がわから 光る。虹の色が ゆっくり めぐる */
  if(now && (b.t >= TOP_T || b.rb) && !b.fly){
    /* クリアの お祝いのあいだは、いつもより 強く 何度か 光る */
    const party = !!(flying && cheerT && now < cheerT);
    const ph = now / (party ? 1050 : 1500);
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(ph * Math.PI));
    const hue = (now * 0.042) % 360;          /* 虹 ひとまわり ≒ 8.5秒 */
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
    /* 虹の子は 絵そのものが 色づくので、光は ひかえめに */
    const soft = b.rb && b.t < TOP_T ? 0.40 : 1;
    gr.addColorStop(0,    'hsla(' + hue + ',100%,86%,'
                          + ((party ? 0.66 : 0.42) * pulse * soft).toFixed(3) + ')');
    gr.addColorStop(0.52, 'hsla(' + hue + ',95%,72%,'
                          + ((party ? 0.40 : 0.26) * pulse * soft).toFixed(3) + ')');
    gr.addColorStop(1,    'hsla(' + hue + ',95%,74%,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
    /* まわりにも ふわっと ひろがる 光 */
    const halo = ctx.createRadialGradient(0, 0, b.r * 0.86, 0, 0, b.r * (1.5 + pulse * 0.22));
    halo.addColorStop(0,   'hsla(' + hue + ',96%,80%,'
                           + ((party ? 0.40 : 0.26) * pulse * soft).toFixed(3) + ')');
    halo.addColorStop(0.5, 'hsla(' + hue + ',96%,76%,'
                           + ((party ? 0.18 : 0.12) * pulse * soft).toFixed(3) + ')');
    halo.addColorStop(1,   'hsla(' + hue + ',96%,76%,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, b.r * (1.5 + pulse * 0.22), 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* くっついた ばかりの子は、内がわから ふわっと 光る */
  if(now && b.glow){
    const q = (now - b.glow) / GLOW_MS;
    if(q >= 1){ b.glow = 0; }
    else {
      const a = (1 - q) * (1 - q);
      const mid = b.glowC === 'chain' ? '210,255,224'
                : b.glowC === 'bow' ? '255,214,224'
                : b.glowC === 'kind' ? '214,236,255' : '255,232,176';
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
      gg.addColorStop(0,   'rgba(255,252,240,' + (0.92 * a).toFixed(3) + ')');
      gg.addColorStop(0.5, 'rgba(' + mid + ',' + (0.5 * a).toFixed(3) + ')');
      gg.addColorStop(1,   'rgba(' + mid + ',0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, b.r * (1 + q * 0.06), 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function fmtT(ms){

  return Math.floor(q / 60) + ':' + (q % 60 < 10 ? '0' : '') + (q % 60);
}

/* 大きさの わっか。小さい子から 時計まわりに 大きくなる */
function paintChain(){
  const row = document.getElementById('chainRow');
  const n = TIERS.length, R = 35;              /* わっかの 半径（％） */
  let h = '<div class="ring"></div>';
  for(let t = 0; t < n; t++){
    const a = (-90 + t * (360 / n)) * Math.PI / 180;
    const x = 50 + R * Math.cos(a), y = 50 + R * Math.sin(a);
    const px = Math.round(17 + 30 * Math.pow(t / (n - 1), 0.85));
    const art = dogSVG(COATS[TIER_COAT[Math.min(TIER_COAT.length - 1, t)]], BOW[0], 0)
      .replace('width="64" height="70"', 'width="' + px + '"');
    h += '<span style="left:' + x.toFixed(2) + '%; top:' + y.toFixed(2) + '%">' + art + '</span>';
    /* あいだの しるし。さいごと さいしょの あいだは «クリア» */
    const am = (-90 + (t + 0.5) * (360 / n)) * Math.PI / 180;
    const last = t === n - 1;
    const RR = last ? R + 12 : R;
    const mx = 50 + RR * Math.cos(am), my = 50 + RR * Math.sin(am);
    const deg = (-90 + (t + 0.5) * (360 / n)) + 90;
    h += '<em class="' + (last ? 'goal' : '') + '" style="left:' + mx.toFixed(2)
       + '%; top:' + my.toFixed(2) + '%'
       + (last ? '' : '; transform:translate(-50%,-50%) rotate(' + deg.toFixed(1) + 'deg)')
       + '">' + (last ? 'CLEAR' : '›') + '</em>';
  }
  row.innerHTML = h;
}

const KEY = 'paw_ball_game_v1';          /* むかしの さいこう記録 */

const LKEY = 'paw_ball_lv_v1';
const TKEY = 'paw_ball_time_v1';
const RKEY = 'paw_ball_rec_v1';          /* なまえごとの 3分の きろく */
const WKEY = 'paw_ball_who_v1';
const CKEY = 'paw_ball_col_v1';          /* なまえごとの すきな いろ */
const COLS = [
  { n:'ちゃいろ',  c:'#B98C55' },
  { n:'ローズ',    c:'#DD8496' },
  { n:'オレンジ',  c:'#E2934E' },
  { n:'きいろ',    c:'#D2A827' },
  { n:'みどり',    c:'#7CAC5D' },
  { n:'みずいろ',  c:'#4CA5B3' },
  { n:'あお',      c:'#6B8FCE' },
  { n:'むらさき',  c:'#A583C8' }
];
const DEF1 = 'タロウ', DEF2 = 'ハナコ';     /* さいしょの ふたり */
let recs = {}, cols = {}, who = DEF1;
function colOf(name){ return cols[name] || COLS[0].c; }
function setCol(c){
  cols[who] = c;
  try{ localStorage.setItem(CKEY, JSON.stringify(cols)); }catch(e){}
  paintRank(); paintCols();
}
function bestOf(name){
  const r = recs[name];
  return r ? (r[BATTLE_LV] | 0) : 0;       /* 3分バトルの てんすう */
}
/* BEST SCORE は 3分バトルでも ∞ でも、いちばん高い てんすう（6 は ∞ の ぶん） */
function anyBest(name){
  const r = recs[name];
  return r ? Math.max(r[BATTLE_LV] | 0, r[6] | 0) : 0;
}
function saveEnd(){                        /* ∞ の てんすうを のこす */
  if(!recs[who]) recs[who] = [0, 0, 0];
  if(score > (recs[who][6] | 0)){
    recs[who][6] = score;
    saveRecs(); paintRank();
    return true;
  }
  return false;
}
/* ∞ を クリアするまでの いちばん短い時間。むずかしさごとに のこす（3,4,5） */
function fastOf(name, l){
  const r = recs[name];
  return r && r[3 + l] ? r[3 + l] : 0;
}
function topBest(){                        /* てんすうが いちばんの 人 */
  let n = null, v = 0;
  Object.keys(recs).forEach(function(k){
    const x = anyBest(k);
    if(x > v){ v = x; n = k; }
  });
  return n ? { name: n, v: v } : null;
}
function topFast(l){                       /* いちばん はやく クリアした人 */
  let n = null, v = 0;
  Object.keys(recs).forEach(function(k){
    const x = fastOf(k, l);
    if(x > 0 && (v === 0 || x < v)){ v = x; n = k; }
  });
  return n ? { name: n, v: v } : null;
}
function loadBest(){
  try{ soundOn = localStorage.getItem(SKEY) !== '0'; }catch(e){ soundOn = true; }
  try{ const raw = localStorage.getItem(RKEY); if(raw) recs = JSON.parse(raw) || {}; }catch(e){ recs = {}; }
  if(!recs || typeof recs !== 'object') recs = {};
  /* むかしの なまえは いまの なまえに ひきつぐ */
  ['ゲスト', '太郎'].forEach(function(o){
    if(recs[o] && !recs[DEF1]){ recs[DEF1] = recs[o]; delete recs[o]; }
  });
  if(!Object.keys(recs).length){
    let old = [0, 0, 0];
    try{
      const raw = localStorage.getItem(BKEY);
      if(raw){ const a = JSON.parse(raw); if(Array.isArray(a)) old = [a[0]|0, a[1]|0, a[2]|0]; }
      else old = [0, parseInt(localStorage.getItem(KEY), 10) || 0, 0];
    }catch(e){}
    if(old[0] || old[1] || old[2]) recs[DEF1] = old;
  }
  if(!Object.keys(recs).length){ recs[DEF1] = [0, 0, 0]; recs[DEF2] = [0, 0, 0]; }
  try{ const w = localStorage.getItem(WKEY); if(w) who = w; }catch(e){}
  if(who === '太郎' || who === 'ゲスト') who = DEF1;
  try{ const raw = localStorage.getItem(CKEY); if(raw) cols = JSON.parse(raw) || {}; }catch(e){ cols = {}; }
  if(!cols || typeof cols !== 'object') cols = {};
  ['ゲスト', '太郎'].forEach(function(o){
    if(cols[o] && !cols[DEF1]){ cols[DEF1] = cols[o]; delete cols[o]; }
  });
  if(!cols[DEF1]) cols[DEF1] = COLS[5].c;            /* タロウは みずいろ */
  if(recs[DEF2] && !cols[DEF2]) cols[DEF2] = COLS[1].c;   /* ハナコは ピンク */
  if(!recs[who]) recs[who] = [0, 0, 0];
  try{ const n = parseInt(localStorage.getItem(LKEY), 10); if(n >= 0 && n <= 2) lv = n; }catch(e){}
  try{ const n = parseInt(localStorage.getItem(TKEY), 10);
       if(n >= 0 && n < TIMES.length) tm = n; }catch(e){}
  LIMIT = TIMES[tm] || Infinity;
  best = bestOf(who);
}
function saveBest(){
  if(!recs[who]) recs[who] = [0, 0, 0];
  recs[who][BATTLE_LV] = best;
  saveRecs();
  paintRank();
}
/* ∞ を クリアするまでに かかった時間 */
function saveFast(ms){
  if(!recs[who]) recs[who] = [0, 0, 0];
  const i = 3 + lv;                    /* むずかしさごとに */
  const old = recs[who][i] || 0;
  if(!old || ms < old) recs[who][i] = Math.round(ms);
  saveRecs();
  paintRank();
}
function saveRecs(){
  try{ localStorage.setItem(RKEY, JSON.stringify(recs)); }catch(e){}
}

/* ---- なまえと、3分の きろく ---- */
function paintRank(){
  /* いちばんの てんすう */
  const bl = document.getElementById('bestLine');
  if(bl){
    const t = topBest();
    bl.innerHTML = '<span class="lab">BEST SCORE</span>'
      + (t ? crown() + '<span class="nm" style="color:' + colOf(t.name) + '">' + esc(t.name) + '</span>'
             + '<span class="sc">' + t.v + '</span>'
           : '<span class="none">まだ ありません</span>');
  }
  /* ∞ を いちばん はやく クリアした人。むずかしさごとに */
  const fl = document.getElementById('fastLine');
  if(fl){
    let h = '<div class="fhead"><span class="inf">\u221e</span>'
          + '<span class="lab jp">クリアまでの時間</span></div>';
    for(let l = 0; l < LEVELS.length; l++){
      const t = topFast(l);
      h += '<div class="frow"><span class="dlv">' + LEVELS[l].name + '</span>'
         + (t ? crown() + '<span class="nm" style="color:' + colOf(t.name) + '">' + esc(t.name) + '</span>'
                + '<span class="sc">' + fmtT(t.v) + '</span>'
              : '<span class="none">まだ ありません</span>')
         + '</div>';
    }
    fl.innerHTML = h;
  }
  const el = document.getElementById('rankList');
  if(!el) return;
  const names = Object.keys(recs).filter(n => bestOf(n) > 0);
  names.sort((a, b) => bestOf(b) - bestOf(a));
  let h = '';
  names.slice(0, 8).forEach((n, i) => {
    h += '<li class="' + (n === who ? 'me' : '') + '">' + medal(i)
       + '<u>' + (i + 1) + '位</u><span style="color:' + colOf(n) + '">'
       + esc(n) + '</span><i>' + bestOf(n) + '</i></li>';
  });
  if(names.indexOf(who) < 0){
    h += '<li class="me">' + medal(-1) + '<u>-</u><span style="color:' + colOf(who) + '">'
       + esc(who) + '</span><i>' + bestOf(who) + '</i></li>';
  }
  if(!h) h = '<li class="none">まだ きろくが ありません</li>';
  el.innerHTML = h;
  const btn = document.getElementById('whoBtn');
  if(btn){
    btn.textContent = who + ' \u25be';
    btn.style.background = colOf(who);                     /* すきな いろ */
    btn.style.boxShadow = '0 6px 14px -9px ' + colOf(who);
  }
}

const MEDAL = [
  { m:'#E8B93B', i:'#F7DE92', r1:'#C0563F', r2:'#9E4433' },   /* 金 */
  { m:'#C0C6CC', i:'#E6EAED', r1:'#6E8AA6', r2:'#587090' },   /* 銀 */
  { m:'#CE8B54', i:'#E9BE92', r1:'#7E9C6D', r2:'#617F56' }    /* 銅 */

function medal(i){

  const c = MEDAL[i];

    + '<path fill="' + c.r1 + '" d="M4.2 0 L9.4 0 L13 9.6 L8 11 Z"/>'

function esc(t){
  return String(t).replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
}
function setWho(name){
  name = String(name || '').trim().slice(0, 8);
  if(!name) return;
  who = name;
  if(!recs[who]) recs[who] = [0, 0, 0];
  if(!cols[who]){                      /* あたらしい人には あいてる いろを */
    const used = Object.keys(cols).map(k => cols[k]);
    const free = COLS.filter(o => used.indexOf(o.c) < 0)[0];
    if(free){
      cols[who] = free.c;
      try{ localStorage.setItem(CKEY, JSON.stringify(cols)); }catch(e){}

  try{ localStorage.setItem(WKEY, who); }catch(e){}

  });
